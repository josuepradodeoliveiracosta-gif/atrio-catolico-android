name = "atrio-push"
main = "src/index.js"
compatibility_date = "2026-10-26"
workers_dev = true

[vars]
GUARDIAO_AI_ENABLED = "false"
PUSH_ENABLED = "false"
# Experimental: somente após homologação isolada de bloqueios entre contas.
# Envia FCM individualmente após comparar blockedMembers em ambos os sentidos.
# Com "false", o fluxo legado de tópicos FCM NÃO é adequado à moderação UGC.
# NÃO habilita, configura ou modifica Workers já implantados.
PUSH_BLOCK_SAFE_FANOUT_ENABLED = "false"
# Broadcast exige ativação separada, depois de testes e auditoria.
BROADCAST_ENABLED = "false"

# Substitua pelo ID do banco Cloudflare D1 criado na sua conta gratuita.
[[d1_databases]]
binding = "PUSH_DB"
database_name = "atrio-push-delivery"
database_id = "COLOQUE_O_DATABASE_ID_AQUI"

# Secrets privados: FIREBASE_SERVICE_ACCOUNT_JSON e FIREBASE_WEB_API_KEY
# Nunca armazene credenciais reais neste arquivo ou em commits Git.


# Capacidade de IA; inferência depende do switch explícito acima.
[ai]
binding = "AI"
