GUARDIAN_V2_ENABLED = "false"
GUARDIAN_V2_HOLD_ENABLED = "false"
# Secrets necessários apenas após revisão: GUARDIAN_FIREBASE_SERVICE_ACCOUNT_JSON, FIREBASE_WEB_API_KEY
# O papel IAM deve ter escopo mínimo. Regras Firestore NÃO restringem Admin SDK.