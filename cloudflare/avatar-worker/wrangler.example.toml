# Copiar para wrangler.toml SOMENTE após autorização de implantação.
name = "atrio-avatares"
main = "src/index.js"
compatibility_date = "2026-10-29"
workers_dev = true

[[d1_databases]]
binding = "AVATAR_DB"
database_name = "atrio-avatar-control"
database_id = "SUBSTITUIR_PELO_ID_DA_BASE_D1"

