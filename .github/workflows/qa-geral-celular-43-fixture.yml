name: QA APK 43 HTTPS — build isolado e assinatura fictícia
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qa-geral-celular-43-https.yml'
      - '.github/workflows/qa-geral-celular-43-fixture.yml'
      - 'scripts/qa_geral_celular_build43_https.sh'
      - 'scripts/qa_geral_celular_round43.py'
      - 'scripts/test_qa_geral_celular_round43.py'
      - 'scripts/test_qa_geral_celular_apk43_route.py'
permissions:
  contents: read
env:
  CANDIDATE_SHA: 587dc41efed0d171aaacd0bda48fb7bff1a9fb58
  CANDIDATE_TREE: 3263fd3640de1c6f8e128dcf384129fde03596cf
  QA_ORIGIN: https://atrio-push-qa-general.atrio-catolico.workers.dev
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  fixture:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/chat5-199-apk43-isolamento-main-440'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Testar contratos e recusas sem credenciais reais
        run: |
          set -euo pipefail
          python3 -m unittest scripts.test_qa_geral_celular_round43 scripts.test_qa_geral_celular_apk43_route -v
          python3 -m scripts.qa_geral_celular_round42 source candidate "$CANDIDATE_SHA" "$CANDIDATE_TREE"
      - name: Compilar com identidade Firebase fictícia e OS user descartável
        run: |
          set -euo pipefail
          umask 077
          fixture="$(python3 - <<'PY'
          import json
          from scripts.qa_geral_remote_build_gate import QA_PROJECT, REGISTERED_APP_ID, fixture
          config = fixture(QA_PROJECT, REGISTERED_APP_ID)
          config["client"][0]["api_key"][0]["current_key"] = "qa43-sem-token-remoto-descartavel"
          print(json.dumps(config))
          PY
          )"
          ATRIO_QA_CELULAR_GOOGLE_SERVICES_JSON="$fixture" \
            bash scripts/qa_geral_celular_build43_https.sh candidate "$CANDIDATE_SHA" \
              "$CANDIDATE_TREE" "$RUNNER_TEMP/qa43-unsigned.apk" "$QA_ORIGIN"
          unset fixture
          tools="$ANDROID_HOME/build-tools/36.0.0"
          python3 -m scripts.qa_geral_celular_round43 metadata "$RUNNER_TEMP/qa43-unsigned.apk" \
            --build-tools "$tools" --notice-https
      - name: Assinar com chave descartável, cifrar, recuperar e recusar entradas adulteradas
        run: |
          set -euo pipefail
          umask 077
          tools="$ANDROID_HOME/build-tools/36.0.0"
          unsigned="$RUNNER_TEMP/qa43-unsigned.apk"
          test -f "$unsigned" && test ! -L "$unsigned"
          "$tools/zipalign" -c -P 16 4 "$unsigned"
          if "$tools/apksigner" verify "$unsigned" >/dev/null 2>&1; then exit 1; fi
          python3 -m scripts.qa_geral_celular_round43 metadata "$unsigned" \
            --build-tools "$tools" --notice-https
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"; rm -f -- "$unsigned"' EXIT
          export ATRIO_QA_CELULAR_STORE_PASSWORD=qa43-descartavel
          export ATRIO_QA_CELULAR_KEY_PASSWORD="$ATRIO_QA_CELULAR_STORE_PASSWORD"
          export ATRIO_QA_CELULAR_KEY_ALIAS=fixture43
          keytool -genkeypair -keystore "$work/fixture.p12" -storetype PKCS12 \
            -storepass:env ATRIO_QA_CELULAR_STORE_PASSWORD -alias "$ATRIO_QA_CELULAR_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 1 -dname CN=QA43-fixture
          cert_sha="$(keytool -exportcert -keystore "$work/fixture.p12" \
            -storepass:env ATRIO_QA_CELULAR_STORE_PASSWORD -alias "$ATRIO_QA_CELULAR_KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          bash scripts/qa_geral_celular_manual.sh sign "$unsigned" "$work/signed.apk" "$work/fixture.p12"
          rm -f -- "$work/fixture.p12"
          unset ATRIO_QA_CELULAR_STORE_PASSWORD ATRIO_QA_CELULAR_KEY_PASSWORD ATRIO_QA_CELULAR_KEY_ALIAS
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
          age-keygen -o "$work/identity" 2>/dev/null
          age -r "$(age-keygen -y "$work/identity")" -o "$work/fixture.apk.age" "$work/signed.apk"
          age -d -i "$work/identity" -o "$work/recovered.apk" "$work/fixture.apk.age"
          signed_sha="$(sha256sum < "$work/signed.apk" | cut -d' ' -f1)"
          recovered_sha="$(sha256sum < "$work/recovered.apk" | cut -d' ' -f1)"
          test "$signed_sha" = "$recovered_sha"
          proof=(python3 -m scripts.qa_geral_celular_round43 proof candidate)
          "${proof[@]}" "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$signed_sha" "$cert_sha" \
            "$work/recovered.apk" --build-tools "$tools" --notice-https | tee "$work/proof"
          reject() {
            if "$@"; then
              echo 'A rota aceitou uma entrada inválida.' >&2; exit 1
            fi
          }
          wrong_git="$(printf '%040d' 0)"
          wrong_digest="$(printf '%064d' 0)"
          reject "${proof[@]}" "$wrong_git" "$CANDIDATE_TREE" "$signed_sha" "$cert_sha" \
            "$work/recovered.apk" --build-tools "$tools" --notice-https
          reject "${proof[@]}" "$CANDIDATE_SHA" "$wrong_git" "$signed_sha" "$cert_sha" \
            "$work/recovered.apk" --build-tools "$tools" --notice-https
          reject "${proof[@]}" "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$signed_sha" "$wrong_digest" \
            "$work/recovered.apk" --build-tools "$tools" --notice-https
          unsigned_sha="$(sha256sum < "$unsigned" | cut -d' ' -f1)"
          reject "${proof[@]}" "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$unsigned_sha" "$cert_sha" \
            "$unsigned" --build-tools "$tools" --notice-https
          printf 'bytes alterados' >> "$work/recovered.apk"
          reject "${proof[@]}" "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$signed_sha" "$cert_sha" \
            "$work/recovered.apk" --build-tools "$tools" --notice-https
          printf '## APK 43 — ensaio fictício, sem assinatura protegida nem FCM real\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Candidata %s, árvore %s\n\n' "$CANDIDATE_SHA" "$CANDIDATE_TREE" >> "$GITHUB_STEP_SUMMARY"
          printf 'Prova: %s\n' "$(tail -n 1 "$work/proof")" >> "$GITHUB_STEP_SUMMARY"
