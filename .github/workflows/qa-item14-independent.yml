name: Item 14 — Chat 7, compatibilidade da nova main e QA independente
on:
  pull_request:
    branches: [main]
    paths:
      - 'firebase/qa-general/chat-retention-item14.mjs'
      - 'tests/security/chat-retention-item14.test.mjs'
      - 'tests/security/package.json'
      - 'tests/security/chat-retention-item14-independent.test.mjs'
      - '.github/workflows/qa-item14-independent.yml'
permissions:
  contents: read
jobs:
  item14-independent:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/chat7-199-item14-main-441'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MAIN_BASE: d1169839ad9f5b33c104d7f7e9e4772df3f304f7
      EXPECTED_ITEM14_HEAD: b1e9feb4b39befbe8bf61dc2751d569384ef32b5
      EXPECTED_ITEM14_TREE: fe15441246a49a4ab15656512903ae64a5ff11e7
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Conferir equivalência #421 e preservar dependências/scripts da main
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_ITEM14_HEAD" && test -n "$EXPECTED_ITEM14_TREE" && test -n "$EXPECTED_MAIN_BASE"
          git cat-file -e "${EXPECTED_ITEM14_HEAD}^{commit}"
          git cat-file -e "${EXPECTED_MAIN_BASE}^{commit}"
          test "$(git rev-parse "${EXPECTED_ITEM14_HEAD}^{tree}")" = "$EXPECTED_ITEM14_TREE"
          test "$(git merge-base HEAD "$EXPECTED_MAIN_BASE")" = "$EXPECTED_MAIN_BASE"
          for path in firebase/qa-general/chat-retention-item14.mjs tests/security/chat-retention-item14.test.mjs; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$EXPECTED_ITEM14_HEAD:$path")"
          done
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const gitJson = (ref) => JSON.parse(execFileSync('git', [
            'show', `${ref}:tests/security/package.json`,
          ], {encoding: 'utf8'}));
          const baseline = gitJson(process.env.EXPECTED_MAIN_BASE);
          const original = gitJson(process.env.EXPECTED_ITEM14_HEAD);
          const actual = JSON.parse(readFileSync('tests/security/package.json', 'utf8'));
          assert.equal(typeof original.scripts['test:chat-retention-item14'], 'string');
          baseline.scripts['test:chat-retention-item14'] = original.scripts['test:chat-retention-item14'];
          assert.deepEqual(actual, baseline, 'A única alteração permitida é o script do item 14');
          console.log('Dependências/scripts da main preservados; script item 14 idêntico à #421.');
          NODE
          printf 'Executor e matriz #421 idênticos; package.json da main preservado + script item14.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Preparar dependências exclusivamente para QA local
        working-directory: tests/security
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node prepare.mjs
      - name: Executar matriz 14.1–14.6 e duas sondas independentes em Firestore Emulator
        working-directory: tests/security
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-atrio-v11 \
            'node --test --test-concurrency=1 chat-retention-item14.test.mjs chat-retention-item14-independent.test.mjs'
      - name: Reexecutar somente focal 14.5, novo processo e novo emulador
        working-directory: tests/security
        shell: bash
        run: |
          set -euo pipefail
          ATRIO_RETENTION_CASE=14.5 ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-atrio-v11 \
            'node --test --test-concurrency=1 chat-retention-item14.test.mjs'
      - name: Registrar limites da evidência
        if: success()
        shell: bash
        run: |
          {
            echo '## Item 14 — revisão QA isolada do Chat 5'
            echo
            echo 'Matriz 14.1–14.6 e sondas independentes: Firestore Emulator somente localhost e dados fictícios.'
            echo 'As duas sondas adicionais conferem Firestore persistido (DM e grupo), cópia legada, sessão, leitura de Miguel e prova mínima do moderador.'
            echo 'Não valida Firebase Auth remoto, agendamento operacional, Rules implantadas, backups reais, UI Android ou aparelho físico.'
            echo 'Não houve operação em produção.'
          } >> "$GITHUB_STEP_SUMMARY"
