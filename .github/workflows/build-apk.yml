name: Gerar APK do Atrio Catolico

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-firebase:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
        with:
          # Somente para classificar de forma segura o histórico anterior da PR.
          fetch-depth: 0
          persist-credentials: false
      - name: Decidir se o APK precisa recompilar
        id: scope
        shell: bash
        env:
          PR_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # main e acionamento manual SEMPRE recompilam; diff incerto também.
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" || "$PR_ACTION" != "synchronize" ||
                ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ || ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'android=true' >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null ||
               ! git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null ||
               ! git merge-base --is-ancestor "$BEFORE_SHA" "$PR_HEAD_SHA"; then
            echo 'android=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=ACDMRT -z "$BEFORE_SHA" "$PR_HEAD_SHA" > "$RUNNER_TEMP/apk-changed.bin"
            python3 scripts/play_ci_android_scope.py --changed-file "$RUNNER_TEMP/apk-changed.bin" >> "$GITHUB_OUTPUT"
          fi
      - name: Registrar escopo da compilacao
        shell: bash
        run: |
          if [[ "${{ steps.scope.outputs.android }}" == "true" ]]; then
            echo "APK: compilação completa necessária." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "APK: recompilação dispensada nesta sincronização (somente backend/docs/testes isolados); validações de segurança da PR seguem ativas." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Configurar Java 17
        if: steps.scope.outputs.android == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        if: steps.scope.outputs.android == 'true'
        uses: android-actions/setup-android@v4
      - name: Configurar Gradle 8.13
        if: steps.scope.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar plataforma Android 36
        if: steps.scope.outputs.android == 'true'
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validar configuracao Firebase
        if: steps.scope.outputs.android == 'true'
        run: python3 scripts/validar_firebase.py
      - name: Compilar APK de testes
        if: steps.scope.outputs.android == 'true'
        env:
          ATRIO_PUSH_WORKER_URL: ${{ vars.ATRIO_PUSH_WORKER_URL || 'https://atrio-push.atrio-catolico.workers.dev' }}
          ATRIO_AVATAR_WORKER_URL: ${{ vars.ATRIO_AVATAR_WORKER_URL || '' }}
          ATRIO_GUARDIAN_V2_WORKER_URL: ${{ vars.ATRIO_GUARDIAN_V2_WORKER_URL || 'https://atrio-guardian-v2.atrio-catolico.workers.dev' }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      # Chave de assinatura não fica disponível para builds automáticos.
      # Mesmo um workflow_dispatch feito em outra branch não acessa os secrets.
      - name: Compilar APK release com chave permanente (quando configurada)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          ATRIO_PUSH_WORKER_URL: ${{ vars.ATRIO_PUSH_WORKER_URL || 'https://atrio-push.atrio-catolico.workers.dev' }}
          ATRIO_AVATAR_WORKER_URL: ${{ vars.ATRIO_AVATAR_WORKER_URL || '' }}
          ATRIO_GUARDIAN_V2_WORKER_URL: ${{ vars.ATRIO_GUARDIAN_V2_WORKER_URL || 'https://atrio-guardian-v2.atrio-catolico.workers.dev' }}
          ATRIO_GUARDIAN_V2_RELEASE_APPROVED: ${{ vars.ATRIO_GUARDIAN_V2_RELEASE_APPROVED || 'false' }}
          ATRIO_KEYSTORE_BASE64: ${{ secrets.ATRIO_KEYSTORE_BASE64 }}
          ATRIO_STORE_PASSWORD: ${{ secrets.ATRIO_STORE_PASSWORD }}
          ATRIO_KEY_PASSWORD: ${{ secrets.ATRIO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Nao assinar o release V2 sem servidor produtivo distinto do laboratorio.
          # Um URL valido nao comprova que o servidor esta homologado: exige aceite
          # separado da configuracao de release do repositorio.
          if [[ "$ATRIO_GUARDIAN_V2_RELEASE_APPROVED" != "true" ]]; then
            echo "::error::Release V2 bloqueado: falta aprovacao de integracao do backend (ATRIO_GUARDIAN_V2_RELEASE_APPROVED)."
            exit 1
          fi
          if [[ "$ATRIO_GUARDIAN_V2_WORKER_URL" != "https://atrio-guardian-v2.atrio-catolico.workers.dev" ]]; then
            echo "::error::Release V2 bloqueado: URL deve apontar para o gateway oficial do Guardião."
            exit 1
          fi
          # No acionamento manual da main, o release deve falhar se faltar qualquer secret.
          if [[ -z "$ATRIO_KEYSTORE_BASE64" || -z "$ATRIO_STORE_PASSWORD" || -z "$ATRIO_KEY_PASSWORD" ]]; then
            echo "::error::Release indisponivel: confira os secrets ATRIO_KEYSTORE_BASE64, ATRIO_STORE_PASSWORD e ATRIO_KEY_PASSWORD."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/atrio-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ATRIO_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          export ATRIO_SIGNING_STORE_FILE="$KEYSTORE"
          export ATRIO_SIGNING_STORE_PASSWORD="$ATRIO_STORE_PASSWORD"
          export ATRIO_SIGNING_KEY_ALIAS="atrio"
          export ATRIO_SIGNING_KEY_PASSWORD="$ATRIO_KEY_PASSWORD"
          gradle :app:assembleRelease --no-daemon --stacktrace
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$RELEASE_APK" ]]; then
            echo "::error::APK release nao foi gerado ou esta vazio."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$RELEASE_APK"
      - name: Disponibilizar APK com assinatura permanente
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: atrio-catolico-release-assinado
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Disponibilizar APK
        if: steps.scope.outputs.android == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atrio-catolico-firebase-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
