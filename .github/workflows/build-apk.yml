name: Gerar APK do Atrio Catolico

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# PR antiga nao deve continuar consumindo runner quando ha commit novo.
# Nao interromper execucao manual de producao nem push na main.
concurrency:
  group: apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  documentation_scope:
    name: Classificar PR documental antes do APK adicional
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - name: Obter classificador confiavel da base da PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Testar classificacao fail-closed offline
        run: python3 -m unittest discover -s scripts -p 'test_ci_documentation_scope.py' -v
      - name: Conferir SHAs e classificar diff sem executar codigo da PR
        id: classify
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          heavy=true
          trap 'printf "heavy=%s\n" "$heavy" >> "$GITHUB_OUTPUT"' EXIT
          [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]] || exit 0
          [[ "$GITHUB_REPOSITORY" == 'josuepradodeoliveiracosta-gif/atrio-catolico-android' ]] || exit 0
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 0
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 0
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || exit 0
          [[ "$(git rev-parse --is-shallow-repository)" == 'false' ]] || exit 0
          [[ "$(git rev-parse HEAD)" == "$PR_BASE_SHA" ]] || exit 0
          git fetch --no-tags --force origin "refs/pull/${PR_NUMBER}/head" || exit 0
          [[ "$(git rev-parse FETCH_HEAD)" == "$PR_HEAD_SHA" ]] || exit 0
          base="$(git merge-base --all "$PR_BASE_SHA" "$PR_HEAD_SHA")" || exit 0
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || exit 0
          git diff --raw -z --no-ext-diff "$base" "$PR_HEAD_SHA" > "$RUNNER_TEMP/atrio-pr-diff.raw" || exit 0
          result="$(python3 scripts/ci_documentation_scope.py --raw-diff-z "$RUNNER_TEMP/atrio-pr-diff.raw" --event pull_request --comparison-verified)" || exit 0
          if [[ "$result" == 'heavy=false' ]]; then
            heavy=false
            echo 'PR apenas documental e diff confiavel: compilacao APK redundante dispensada.'
          fi

  apk-firebase:
    # Estes checks NAO sao dispensados: Segredos, Versao, Firestore e
    # Compilar Android de testes no workflow selos-ci.yml.
    needs: documentation_scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.documentation_scope.outputs.heavy != 'false') }}
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest
    # Impede setup de SDK/Gradle indefinidamente ativo sem novo log.
    timeout-minutes: 25
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar plataforma Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validar configuracao Firebase
        run: python3 scripts/validar_firebase.py
      - name: Compilar APK de testes
        env:
          ATRIO_PUSH_WORKER_URL: ${{ vars.ATRIO_PUSH_WORKER_URL || 'https://atrio-push.atrio-catolico.workers.dev' }}
          ATRIO_AVATAR_WORKER_URL: ${{ vars.ATRIO_AVATAR_WORKER_URL || '' }}
          ATRIO_GUARDIAN_V2_WORKER_URL: ${{ vars.ATRIO_GUARDIAN_V2_WORKER_URL || 'https://atrio-guardian-v2.atrio-catolico.workers.dev' }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      # Chave de assinatura não fica disponível para builds automáticos.
      # Mesmo um workflow_dispatch feito em outra branch não acessa os secrets.
      - name: Compilar APK release com chave permanente (quando configurada)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          ATRIO_PUSH_WORKER_URL: ${{ vars.ATRIO_PUSH_WORKER_URL || 'https://atrio-push.atrio-catolico.workers.dev' }}
          ATRIO_AVATAR_WORKER_URL: ${{ vars.ATRIO_AVATAR_WORKER_URL || '' }}
          ATRIO_GUARDIAN_V2_WORKER_URL: ${{ vars.ATRIO_GUARDIAN_V2_WORKER_URL || 'https://atrio-guardian-v2.atrio-catolico.workers.dev' }}
          ATRIO_GUARDIAN_V2_RELEASE_APPROVED: ${{ vars.ATRIO_GUARDIAN_V2_RELEASE_APPROVED || 'false' }}
          ATRIO_EMAIL_VERIFICATION_RELEASE_APPROVED: ${{ vars.ATRIO_EMAIL_VERIFICATION_RELEASE_APPROVED || 'false' }}
          ATRIO_OTA_E2E_TESTED: ${{ vars.ATRIO_OTA_E2E_TESTED || 'false' }}
          ATRIO_OTA_RELEASE_APPROVED: ${{ vars.ATRIO_OTA_RELEASE_APPROVED || 'false' }}
          ATRIO_KEYSTORE_BASE64: ${{ secrets.ATRIO_KEYSTORE_BASE64 }}
          ATRIO_STORE_PASSWORD: ${{ secrets.ATRIO_STORE_PASSWORD }}
          ATRIO_KEY_PASSWORD: ${{ secrets.ATRIO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Trava prioritária de OTA: só assinar após um ciclo ponta a ponta
          # REAL no aparelho, com download dentro do Átrio, instalação
          # por cima, assinatura idêntica, versionCode crescente e dados mantidos.
          # A aprovação final da distribuição é separada da evidência de QA.
          if [[ "$ATRIO_OTA_E2E_TESTED" != "true" ]]; then
            echo "::error::APK Release bloqueado: OTA não homologado de ponta a ponta em aparelho real (ATRIO_OTA_E2E_TESTED)."
            exit 1
          fi
          if [[ "$ATRIO_OTA_RELEASE_APPROVED" != "true" ]]; then
            echo "::error::APK Release bloqueado: falta autorização explícita após ativar e homologar OTA (ATRIO_OTA_RELEASE_APPROVED)."
            exit 1
          fi
          # Trava independente: nao lancar release enquanto o e-mail confirmado
          # nao for obrigatorio e homologado no Firebase de producao.
          # False por padrao; so aprovar apos rollout e verificacao de contas antigas.
          if [[ "$ATRIO_EMAIL_VERIFICATION_RELEASE_APPROVED" != "true" ]]; then
            echo "::error::Release bloqueado: confirmacao obrigatoria de e-mail nao homologada (ATRIO_EMAIL_VERIFICATION_RELEASE_APPROVED)."
            exit 1
          fi
          # Nao assinar o release V2 sem servidor produtivo distinto do laboratorio.
          # Um URL valido nao comprova que o servidor esta homologado: exige aceite
          # separado da configuracao de release do repositorio.
          if [[ "$ATRIO_GUARDIAN_V2_RELEASE_APPROVED" != "true" ]]; then
            echo "::error::Release V2 bloqueado: falta aprovacao de integracao do backend (ATRIO_GUARDIAN_V2_RELEASE_APPROVED)."
            exit 1
          fi
          if [[ "$ATRIO_GUARDIAN_V2_WORKER_URL" != "https://atrio-guardian-v2.atrio-catolico.workers.dev" ]]; then
            echo "::error::Release V2 bloqueado: URL deve apontar para o gateway oficial do Guardião."
            exit 1
          fi
          # No acionamento manual da main, o release deve falhar se faltar qualquer secret.
          if [[ -z "$ATRIO_KEYSTORE_BASE64" || -z "$ATRIO_STORE_PASSWORD" || -z "$ATRIO_KEY_PASSWORD" ]]; then
            echo "::error::Release indisponivel: confira os secrets ATRIO_KEYSTORE_BASE64, ATRIO_STORE_PASSWORD e ATRIO_KEY_PASSWORD."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/atrio-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ATRIO_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          export ATRIO_SIGNING_STORE_FILE="$KEYSTORE"
          export ATRIO_SIGNING_STORE_PASSWORD="$ATRIO_STORE_PASSWORD"
          export ATRIO_SIGNING_KEY_ALIAS="atrio"
          export ATRIO_SIGNING_KEY_PASSWORD="$ATRIO_KEY_PASSWORD"
          gradle :app:assembleRelease --no-daemon --stacktrace
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$RELEASE_APK" ]]; then
            echo "::error::APK release nao foi gerado ou esta vazio."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$RELEASE_APK"
          # Um APK valido criptograficamente nao garante continuidade da chave
          # do Atrio. Rejeitar assinatura diferente da referencia oficial 0.20.0.
          python3 -m scripts.ota_release_cert \
            --apk "$RELEASE_APK" --android-sdk "$ANDROID_HOME"
      - name: Disponibilizar APK com assinatura permanente
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: atrio-catolico-release-assinado
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: atrio-catolico-firebase-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
