name: Prévia visual Átrio v2 — APK isolado

# Laboratório específico da PR de redesenho. Nunca produz Release nem usa
# assinatura oficial. Sem Firebase de produção, push ou credenciais.
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - '.github/workflows/design-preview.yml'

permissions:
  contents: read

# Testes de PR independentes: preservar os resultados de cada run_id.
concurrency:
  group: atrio-v2-preview-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.number == 180 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código da PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar plataformas Android
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verificar isolamento da demonstração
        shell: bash
        run: |
          set -euo pipefail
          # Remover SOMENTE na cópia descartável do runner; o repositório
          # e sua configuração oficial permanecem intocados.
          if [[ -f app/google-services.json ]]; then
            rm -- app/google-services.json
          fi
          test ! -e app/google-services.json
          test -z "${ATRIO_PUSH_WORKER_URL:-}"
          test -z "${ATRIO_GUARDIAN_V2_WORKER_URL:-}"
          test -z "${ATRIO_AVATAR_WORKER_URL:-}"
          test -z "${ATRIO_SIGNING_STORE_FILE:-}"
          echo 'Prévia sem Firebase, Worker e chave de produção.'
      - name: Compilar APK de demonstração isolado
        env:
          ATRIO_DESIGN_PREVIEW: '1'
          ATRIO_PUSH_WORKER_URL: ''
          ATRIO_GUARDIAN_V2_WORKER_URL: ''
          ATRIO_AVATAR_WORKER_URL: ''
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Conferir pacote e assinatura de testes
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          package="$("$aapt" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          test "$package" = 'br.com.atriocatolico.v2preview'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          echo 'Pacote de demonstração isolado confirmado; não substitui versão 0.20.4.'
      - name: Disponibilizar APK de prévia (sem publicar Release)
        uses: actions/upload-artifact@v4
        with:
          name: atrio-v2-preview-offline-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
