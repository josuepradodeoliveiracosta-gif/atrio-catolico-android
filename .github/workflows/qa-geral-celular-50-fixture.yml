name: QA 50 — ensaio descartável isolado
on:
  push:
    branches: [qa/apk50-participacao-candidato]
    paths:
      - '.github/workflows/qa-geral-celular-50-fixture.yml'
      - 'scripts/qa_geral_celular_build50_https.sh'
      - 'scripts/qa_geral_celular_round50.py'
permissions:
  contents: read
env:
  CANDIDATE_SHA: 438631dc01c5e8900ae4f2471dc6000539436b7d
  QA_ORIGIN: https://atrio-push-qa-general.atrio-catolico.workers.dev
jobs:
  fixture50:
    name: Compilar APK 50 e validar assinatura descartável
    if: github.event_name == 'push' && github.repository == 'josuepradodeoliveiracosta-gif/atrio-catolico-android' && github.ref == 'refs/heads/qa/apk50-participacao-candidato'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Fixar árvore do commit candidato
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          tree="$(git -C candidate rev-parse HEAD^{tree})"
          [[ "$tree" =~ ^[a-f0-9]{40}$ ]]
          printf 'CANDIDATE_TREE=%s\n' "$tree" >> "$GITHUB_ENV"
          printf 'Candidato %s / árvore %s\n' "$CANDIDATE_SHA" "$tree" >> "$GITHUB_STEP_SUMMARY"
      - name: Compilar candidato sem credenciais reais
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          fixture="$(python3 - <<'PY'
          import json
          from scripts.qa_geral_remote_build_gate import QA_PROJECT, REGISTERED_APP_ID, fixture
          cfg = fixture(QA_PROJECT, REGISTERED_APP_ID)
          cfg["client"][0]["api_key"][0]["current_key"] = "qa50-sem-token-remoto-descartavel"
          print(json.dumps(cfg))
          PY
          )"
          ATRIO_QA_CELULAR_GOOGLE_SERVICES_JSON="$fixture" \
            bash scripts/qa_geral_celular_build50_https.sh candidate "$CANDIDATE_SHA" \
              "$CANDIDATE_TREE" "$RUNNER_TEMP/qa50-fixture.apk" "$QA_ORIGIN"
          unset fixture
          tools="$ANDROID_HOME/build-tools/36.0.0"
          python3 -m scripts.qa_geral_celular_round50 metadata "$RUNNER_TEMP/qa50-fixture.apk" --build-tools "$tools"
          python3 - "$RUNNER_TEMP/qa50-fixture.apk" <<'PY'
          import hashlib, pathlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              for area in ("login", "cadastro", "boas-vindas", "participacao"):
                  manifest = pathlib.Path("candidate/docs/vitrais-" + area + ".sha256")
                  entries = [line.split() for line in manifest.read_text().splitlines() if line.strip()]
                  assert len(entries) == 6
                  for digest, name in entries:
                      assert hashlib.sha256(apk.read("assets/" + area + "-vitrais/" + name)).hexdigest() == digest
                  print(area + ": 6 artes conferidas")
          PY
      - name: Validar assinatura descartável e prova de origem
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"; rm -f -- "$RUNNER_TEMP/qa50-fixture.apk"' EXIT
          export ATRIO_QA_CELULAR_STORE_PASSWORD=qa50-descartavel
          export ATRIO_QA_CELULAR_KEY_PASSWORD="$ATRIO_QA_CELULAR_STORE_PASSWORD"
          export ATRIO_QA_CELULAR_KEY_ALIAS=fixture49
          keytool -genkeypair -keystore "$work/fixture.p12" -storetype PKCS12 \
            -storepass:env ATRIO_QA_CELULAR_STORE_PASSWORD -alias "$ATRIO_QA_CELULAR_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 1 -dname CN=QA49-fixture
          cert="$(keytool -exportcert -keystore "$work/fixture.p12" -storepass:env ATRIO_QA_CELULAR_STORE_PASSWORD -alias "$ATRIO_QA_CELULAR_KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          bash scripts/qa_geral_celular_manual.sh sign "$RUNNER_TEMP/qa50-fixture.apk" "$work/signed.apk" "$work/fixture.p12"
          hash="$(sha256sum < "$work/signed.apk" | cut -d' ' -f1)"
          python3 -m scripts.qa_geral_celular_round50 proof candidate "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$hash" "$cert" "$work/signed.apk" --build-tools "$ANDROID_HOME/build-tools/36.0.0"
          echo "Ensaio descartável aprovado; nenhuma assinatura permanente utilizada."
