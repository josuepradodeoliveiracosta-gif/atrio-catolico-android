name: QA Perfil V3 - projeção e consentimento
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/security/profile-v3.test.mjs'
      - 'tests/security/profile-v3-interests.test.mjs'
      - 'tests/security/serve-profile-v3-discussion-android-qa.mjs'
      - 'cloudflare/push-worker/src/profile-interest-discussion.js'
      - 'app/src/main/java/br/com/atriocatolico/ProfileV3*.kt'
      - 'app/src/main/java/br/com/atriocatolico/PublicMemberProfile.kt'
      - 'app/src/androidTest/java/br/com/atriocatolico/ProfileV3*EmulatorUiTest.kt'
      - 'app/src/test/java/br/com/atriocatolico/ProfileV3PolicyTest.kt'
      - 'scripts/run-qa-android-emulator.sh'
      - '.github/workflows/qa-profile-v3-atomic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testar regras V3 com contas fictícias
        working-directory: tests/security
        env:
          CI: 'true'
        run: |
          npm ci --ignore-scripts
          node prepare.mjs
          npx firebase emulators:exec --only auth,firestore --project demo-atrio-v11 "node profile-v3.test.mjs && node profile-v3-interests.test.mjs"
  android-consent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATRIO_QA_GERAL_BUILD: '1'
      ATRIO_QA_APK: qaGeral
      ATRIO_QA_FIREBASE_PROJECT: demo-atrio-v11
      ATRIO_QA_SUITE: ProfileV3ConsentEmulatorUiTest
      ATRIO_QA_PROFILE_V3_DISCUSSIONS_HTTP: '1'
      ATRIO_QA_PROFILE_V3_TALKBACK_SPEECH: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
          cache-disabled: ${{ github.event_name == 'pull_request' }}
      - name: Isolar o checkout e iniciar compilação de QA
        run: |
          git rev-parse HEAD HEAD^{tree}
          rm -f -- app/google-services.json
          bash scripts/qa-android-prebuild.sh start
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --prefix tests/security
      - name: Preparar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Testar Perfil V3 no Android virtual e no Worker local
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disk-size: 2048M
          ram-size: 2048M
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel on -camera-back none
          script: |
            bash scripts/run-qa-android-emulator.sh
            adb pull /data/local/tmp/qa-contribution-talkback.png qa-contribution-talkback.png
            bash -e -c 'original=$(adb shell settings get system font_scale | tr -d "\\r"); restore() { if [ "$original" = null ]; then adb shell settings delete system font_scale; else adb shell settings put system font_scale "$original"; fi; }; trap restore EXIT; adb shell settings put system font_scale 1.5; gradle :app:connectedQaGeralAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=br.com.atriocatolico.LiturgicalWelcomeUiTest'
      - name: Guardar APK QA Geral usado na homologação visual
        uses: actions/upload-artifact@v4
        with:
          name: qa-geral-emulador-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/apk/qaGeral/app-qaGeral.apk
          retention-days: 7
          if-no-files-found: error
      - name: Testar a variante qaGeral na JVM
        run: gradle :app:testQaGeralUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-profile-v3-consent-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            qa-android-suite-results
            qa-contribution-talkback.png
            qa-firebase-emulators.log
            qa-android-prebuild.log
            app/build/test-results/testQaGeralUnitTest
          retention-days: 7
          if-no-files-found: warn
