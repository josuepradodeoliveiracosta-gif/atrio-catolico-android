name: QA Perfil V3 - atomicidade de visibilidade
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/security/profile-v3.test.mjs'
      - '.github/workflows/qa-profile-v3-atomic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testar regras V3 com contas fictícias
        working-directory: tests/security
        env:
          CI: 'true'
        run: |
          npm ci --ignore-scripts
          node prepare.mjs
          npx firebase emulators:exec --only firestore --project demo-atrio-v11 "node profile-v3.test.mjs"
