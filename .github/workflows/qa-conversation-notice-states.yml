name: QA Android - estados dos avisos 08 e 09

on:
  pull_request:
    branches: [qa/chat7-199-composicao-08-09]
    paths:
      - '.github/workflows/qa-conversation-notice-states.yml'
      - 'scripts/qa-android-notice-states.sh'

permissions:
  contents: read

jobs:
  estados-android:
    if: github.head_ref == 'qa/chat5-199-422-estados-0809'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATRIO_QA_GERAL_BUILD: '1'
      ATRIO_QA_CONVERSATION_NOTICE_LAB: '1'
      ATRIO_QA_GERAL_CELULAR_PILOT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Preparar build local e acesso ao emulador
        run: |
          mkdir -p qa-notice-states
          git rev-parse HEAD HEAD^{tree} | tee qa-notice-states/checkout.txt
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}${ATRIO_QA_GERAL_REMOTE_BUILD:-}${ATRIO_QA_GERAL_PUSH_BUILD:-}${ATRIO_QA_CONVERSATION_NOTICE_ORIGIN:-}"
          for config in app/src/qaGeral/google-services.json app/src/chatQa/google-services.json app/src/perfilQa/google-services.json; do
            test ! -e "$config"
          done
          rm -f -- app/google-services.json
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Compilar somente o APK de laboratório
        run: |
          gradle :app:assembleQaGeral --daemon --stacktrace --max-workers=2
          apk=app/build/outputs/apk/qaGeral/app-qaGeral.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          test "$("$aapt" dump packagename "$apk")" = br.com.atriocatolico.qageral.celular
          "$aapt" dump badging "$apk" > qa-notice-states/apk.txt
          grep -F android.permission.POST_NOTIFICATIONS qa-notice-states/apk.txt
          sha256sum "$apk" | tee qa-notice-states/apk-sha256.txt
      - name: Verificar estados nas duas instâncias
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disk-size: 2048M
          ram-size: 2048M
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel on -camera-back none
          script: bash scripts/qa-android-notice-states.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-notice-states-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: qa-notice-states/
          retention-days: 7
          if-no-files-found: error
