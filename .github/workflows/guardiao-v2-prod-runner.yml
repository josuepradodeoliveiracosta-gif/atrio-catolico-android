name: Guardião V2 — identidade e observação limitada (sem moderação)
# Token temporário. Cron de observação LEITURA SOMENTE; nunca faz moderação.
# A política Firestore controla o modo de emergência. Ainda sem escrita de casos.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      confirm_identity_test:
        description: "Confirmo token WIF em execução manual"
        required: true
        type: boolean
        default: false
      confirm_config_read:
        description: "Autorizo UMA leitura GET de guardian_config/policy sem imprimir dados"
        required: true
        type: boolean
        default: false
      confirm_shadow_scan:
        description: "Autorizo leitura/classificação de até 4 documentos, sem modificar nada"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: guardian-v2-production-identity
  cancel-in-progress: false

jobs:
  identity-only:
    if: ${{ github.repository == 'josuepradodeoliveiracosta-gif/atrio-catolico-android' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    name: Identidade e observação V2 somente leitura
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Validar o contexto antes de pedir OIDC
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm_identity_test }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "josuepradodeoliveiracosta-gif/atrio-catolico-android"
          test "$GITHUB_REF" = "refs/heads/main"
          case "$GITHUB_EVENT_NAME" in
            schedule) ;;
            workflow_dispatch) test "$CONFIRM" = "true" ;;
            *) exit 2 ;;
          esac
          echo "Contexto GitHub verificado; solicitando token temporário."
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obter identidade WIF com validade curta
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: atrio-catolico
          workload_identity_provider: projects/256733686427/locations/global/workloadIdentityPools/guardian-v2-prod/providers/github-main
          service_account: guardian-v2-runner@atrio-catolico.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/datastore
          create_credentials_file: false
      - name: Confirmar somente o sucesso da autenticação
        shell: bash
        env:
          TEMPORARY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "$TEMPORARY_ACCESS_TOKEN"
          echo "GUARDIAN_V2_WIF_AUTHENTICATED — credencial temporária; moderação desligada."
      - name: Consultar uma única configuração Firestore sem mostrar o conteúdo
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_config_read == true && inputs.confirm_shadow_scan != true }}
        shell: bash
        env:
          TEMPORARY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CONFIRM_IDENTITY: ${{ inputs.confirm_identity_test }}
          CONFIRM_READ: ${{ inputs.confirm_config_read }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "josuepradodeoliveiracosta-gif/atrio-catolico-android"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$CONFIRM_IDENTITY" = "true"
          test "$CONFIRM_READ" = "true"
          test -n "$TEMPORARY_ACCESS_TOKEN"
          # Um único GET de configuração, com máscara de campo. Sem scan, sem
          # índices, sem escrita, sem retry, sem imprimir resposta ou token.
          status=$(curl --silent --show-error --request GET --output /dev/null \
            --write-out '%{http_code}' --connect-timeout 5 --max-time 12 \
            --retry 0 \
            --header "Authorization: Bearer $TEMPORARY_ACCESS_TOKEN" \
            --header "Accept: application/json" \
            "https://firestore.googleapis.com/v1/projects/atrio-catolico/databases/(default)/documents/guardian_config/policy?mask.fieldPaths=enabled")
          case "$status" in
            200)
              echo "GUARDIAN_V2_FIRESTORE_CONFIG_READ_OK — HTTP 200; nenhum dado exposto"
              ;;
            404)
              echo "::error::GUARDIAN_V2_CONFIG_NOT_FOUND — HTTP 404; a configuração ainda não foi inicializada"
              exit 4
              ;;
            401|403)
              echo "::error::GUARDIAN_V2_IAM_OR_TOKEN_DENIED — HTTP $status; não ampliar privilégios automaticamente"
              exit 5
              ;;
            *)
              echo "::error::GUARDIAN_V2_READ_UNAVAILABLE — HTTP $status"
              exit 6
              ;;
          esac

      - name: Observar até quatro documentos com limite de execuções
        if: ${{ github.event_name == 'schedule' || inputs.confirm_shadow_scan == true }}
        env:
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIF_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CONFIRM_IDENTITY: ${{ inputs.confirm_identity_test }}
          CONFIRM_SHADOW: ${{ inputs.confirm_shadow_scan }}
          GUARDIAN_V2_SHADOW_ONLY: 'true'
          GUARDIAN_V2_HOLD_ENABLED: 'false'
          GUARDIAN_V2_WRITE_ENABLED: 'false'
        run: node scripts/guardian-v2-shadow-cycle.mjs
