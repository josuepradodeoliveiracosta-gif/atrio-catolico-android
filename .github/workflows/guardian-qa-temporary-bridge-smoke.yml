name: Guardião QA — teste remoto da ponte temporária (sem segredos)
on:
  push:
    branches: [feature/guardiao-autonomo-20261029]
    paths:
      - docs/guardiao-qa-bridge-smoke-trigger.txt
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guardian-qa-remote-bridge-smoke
  cancel-in-progress: false
jobs:
  forged-token:
    name: Worker QA real nega anônimo e token forjado
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Teste HTTP sem conta, chave, senha ou ID token real
        shell: bash
        env:
          QA: https://atrio-guardian-v2-qa.atrio-catolico.workers.dev
        run: |
          set -euo pipefail
          call() {
            local method="$1" path="$2" expected="$3" code="$4" header="${5:-}"
            local http
            if [ -n "$header" ]; then
              http=$(curl -sS -X "$method" --connect-timeout 7 --max-time 15 \
                -H "Authorization: $header" -o /tmp/guardian-bridge-resp -w '%{http_code}' "$QA$path")
            else
              http=$(curl -sS -X "$method" --connect-timeout 7 --max-time 15 \
                -o /tmp/guardian-bridge-resp -w '%{http_code}' "$QA$path")
            fi
            if [ "$http" != "$expected" ]; then
              echo "QA_HTTP_MISMATCH: $method $path got=$http expected=$expected"
              return 1
            fi
            if [ "$(cat /tmp/guardian-bridge-resp)" != "{\"status\":\"$code\"}" ]; then
              echo "QA_RESPONSE_MISMATCH: $method $path (body not echoed)"
              return 1
            fi
            echo "QA_HTTP_OK: $method $path $http"
          }
          # Cloudflare version deployment may require brief global propagation.
          # Do not send tokens or consume D1 until no-auth returns 401.
          ready=false
          for attempt in $(seq 1 20); do
            current=$(curl -sS -X POST --connect-timeout 7 --max-time 15 \
              -o /tmp/guardian-bridge-ready -w '%{http_code}' "$QA/qa/firebase-fixture")
            if [ "$current" = "401" ] && [ "$(cat /tmp/guardian-bridge-ready)" = '{"status":"unauthorized"}' ]; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "QA_GATE_NOT_READY: no temporary bridge propagation"
            exit 1
          fi
          call GET /health 200 guardian_v2_qa_safe
          call POST /admin/config 503 qa_read_only
          call POST /admin/review 503 qa_read_only
          call POST /qa/firebase-fixture 401 unauthorized
          fake="Bearer aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
          call POST /qa/firebase-fixture 403 forbidden "$fake"
          echo 'GUARDIAN_QA_TEMPORARY_BRIDGE: VERIFIED_DENIAL_AND_AUTH_REQUIREMENTS'
