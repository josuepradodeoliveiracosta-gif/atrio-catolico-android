name: Piloto QA Geral Celular no Android Emulator

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qa-geral-celular-pilot-android.yml'
      - 'app/**'
      - 'firebase/qa-geral-celular/**'
      - 'scripts/run-qa-android-emulator.sh'
      - 'tests/security/seed-qa-celular-pilot-android.mjs'

permissions:
  contents: read

concurrency:
  group: qa-celular-pilot-android-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android:
    name: ${{ matrix.mode == 'discovery' && 'Compose focal da inbox emulada' || (matrix.mode == 'history' && 'Histórico com Rules compostas no emulador' || 'android') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(github.head_ref == 'qa/chat5-inbox-366-d8e0b122' && '["discovery","history"]' || '["pilot"]') }}
    env:
      ATRIO_QA_GERAL_BUILD: '1'
      ATRIO_QA_GERAL_CELULAR_PILOT: ${{ matrix.mode == 'pilot' && '1' || '0' }}
      ATRIO_QA_INBOX_DISCOVERY: ${{ matrix.mode == 'discovery' && '1' || '0' }}
      ATRIO_QA_APK: qaGeral
      ATRIO_QA_FIREBASE_PROJECT: demo-atrio-v11
      ATRIO_QA_SUITE: ${{ matrix.mode == 'discovery' && 'AtrioInboxDiscoveryEmulatorUiTest' || 'AtrioConversasCompostasEmulatorUiTest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
      - name: Compilar a variante local sem configuração Firebase remota
        run: |
          git rev-parse HEAD
          rm -f -- app/google-services.json
          bash scripts/qa-android-prebuild.sh start
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/security/package-lock.json
      - name: Preparar Firebase Emulator
        run: npm ci --prefix tests/security
      - name: Habilitar Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Validar a suíte focal com contas fictícias
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disk-size: 2048M
          ram-size: 2048M
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel on -camera-back none
          script: bash scripts/run-qa-android-emulator.sh
      - name: Registrar o pacote e o SHA-256 do APK instrumentado
        run: |
          apk='app/build/outputs/apk/qaGeral/app-qaGeral.apk'
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n1)"
          "$aapt" dump badging "$apk" | awk '/^package: / { print }'
          expected_package='br.com.atriocatolico.qageral.celular'
          if [[ "$ATRIO_QA_GERAL_CELULAR_PILOT" == '0' ]]; then
            expected_package='br.com.atriocatolico.qageral'
          fi
          test "$("$aapt" dump packagename "$apk")" = "$expected_package"
          sha256sum "$apk"
      - name: Preservar evidências da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-celular-pilot-android-${{ matrix.mode }}-${{ github.event.pull_request.head.sha }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            qa-android-suite-results
            qa-firebase-emulators.log
            qa-inbox-discovery-emulator.log
            qa-android-prebuild.log
          retention-days: 7
          if-no-files-found: warn
