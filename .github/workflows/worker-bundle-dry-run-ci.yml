name: Empacotar Workers Cloudflare sem publicar

on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/avatar-worker/**'
      - 'cloudflare/push-worker/**'
      - 'cloudflare/email-verification-policy*.mjs'
      - 'cloudflare/worker-email-gate.test.mjs'
      - '.github/workflows/worker-bundle-dry-run-ci.yml'
      - 'scripts/ci_worker_scope.py'
      - 'scripts/test_ci_worker_scope.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atrio-worker-dry-run-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-only:
    name: Wrangler bundle e validacao sem deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obter codigo sem persistir credenciais
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Testar classificador offline e Git real isolado
        run: python3 -m unittest scripts.test_ci_worker_scope scripts.test_ci_worker_scope_integration -v
      - name: Selecionar bundles por diff verificavel (falha segura)
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci_worker_scope.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --output "$GITHUB_OUTPUT"
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Empacotar Worker de avatares sem login nem upload
        if: ${{ steps.scope.outputs.avatar == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ''
        run: |
          npx --yes wrangler@4 deploy \
            --config cloudflare/avatar-worker/wrangler.toml \
            --dry-run \
            --outdir "$RUNNER_TEMP/atrio-avatar-bundle"
      - name: Empacotar Worker de notificacoes sem login nem upload
        if: ${{ steps.scope.outputs.push == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ''
        run: |
          npx --yes wrangler@4 deploy \
            --config cloudflare/push-worker/wrangler.toml \
            --dry-run \
            --outdir "$RUNNER_TEMP/atrio-push-bundle"
      - name: Confirmar somente os pacotes selecionados
        shell: bash
        env:
          RUN_AVATAR: ${{ steps.scope.outputs.avatar }}
          RUN_PUSH: ${{ steps.scope.outputs.push }}
        run: |
          set -euo pipefail
          [[ "$RUN_AVATAR" == 'true' || "$RUN_PUSH" == 'true' ]]
          if [[ "$RUN_AVATAR" == 'true' ]]; then
            test -d "$RUNNER_TEMP/atrio-avatar-bundle"
            test "$(find "$RUNNER_TEMP/atrio-avatar-bundle" -type f | wc -l)" -gt 0
          fi
          if [[ "$RUN_PUSH" == 'true' ]]; then
            test -d "$RUNNER_TEMP/atrio-push-bundle"
            test "$(find "$RUNNER_TEMP/atrio-push-bundle" -type f | wc -l)" -gt 0
          fi
          echo "Bundles: avatar=$RUN_AVATAR push=$RUN_PUSH" >> "$GITHUB_STEP_SUMMARY"
