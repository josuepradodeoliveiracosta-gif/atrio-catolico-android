name: QA Geral Celular — compilação manual protegida

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'SHA completo aprovado pelo fundador para a compilação'
        required: true
        type: string
      build_kind:
        description: 'Tipo de compilação autorizado para este disparo'
        type: choice
        options: [single, pair, functional]
        default: single
        required: true
      deliver_pair:
        description: 'Disponibilizar o par cifrado após autorização específica'
        type: boolean
        default: false
        required: true
      deliver_functional:
        description: 'Disponibilizar o APK funcional cifrado após autorização específica'
        type: boolean
        default: false
        required: true
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/qa-geral-celular-manual.yml
      - app/build.gradle.kts
      - app/src/main/java/br/com/atriocatolico/MainActivity.kt
      - app/src/main/java/br/com/atriocatolico/QaGeralCelularUpdateScreen.kt
      - app/src/qaGeral/**
      - scripts/qa_geral_remote_build_gate.py
      - scripts/qa_geral_celular_*.py
      - scripts/qa_geral_celular_manual.sh
      - scripts/test_qa_geral_celular_manual.sh
      - scripts/test_qa_geral_celular_screens.py
      - scripts/ota_apk_preflight.py

permissions:
  contents: read

jobs:
  fixtures:
    name: Testar aprovação com APKs fictícios
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
          cache-read-only: true
      - name: Conferir que a entrega é opt-in e só envia o cifrado
        shell: bash
        run: |
          ruby -ryaml - .github/workflows/qa-geral-celular-manual.yml <<'RUBY'
          workflow = YAML.load_file(ARGV.fetch(0))
          dispatch = (workflow["on"] || workflow.fetch(true)).fetch("workflow_dispatch")
          deliveries = {
            "pair" => ["deliver_pair", "atrio-qa-geral-celular-38-39.zip.age"],
            "functional" => ["deliver_functional", "atrio-qa-geral-celular-funcional.zip.age"]
          }
          uploads = workflow.fetch("jobs").flat_map do |id, job|
            job.fetch("steps", []).filter_map { |step| [id, step] if step.fetch("uses", "").start_with?("actions/upload-artifact@") }
          end
          abort "Uploads fora do job protegido." unless uploads.size == deliveries.size && uploads.all? { |id, _| id == "compilar-manual" }
          deliveries.each do |kind, (flag, file)|
            input = dispatch.fetch("inputs").fetch(flag)
            abort "A entrega deve vir desabilitada." unless input["type"] == "boolean" && input["default"] == false
            gate = "inputs.#{flag} && inputs.build_kind == '#{kind}' && steps.assinar.outputs.entrega == 'true'"
            entry = uploads.find { |_, step| step["if"] == gate }
            abort "Gate ou caminho de entrega divergente." unless entry && entry.last.fetch("with").fetch("path").end_with?("/#{file}")
          end
          puts "Entregas desabilitadas por padrão. Upload condicionado dos .zip.age no job protegido."
          RUBY
      - name: Compilar e testar com certificados descartáveis
        shell: bash
        run: |
          if ! command -v age >/dev/null || ! command -v age-keygen >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends age
          fi
          rm -f -- app/google-services.json
          bash scripts/test_qa_geral_celular_manual.sh "$RUNNER_TEMP/qa-celular-ui"
      - name: Habilitar KVM na VM de CI
        shell: bash
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Validar telas 37 a 39 e atualização para o 40 no emulador
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          target: google_apis
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel on -camera-back none
          script: python3 -m scripts.test_qa_geral_celular_screens "$RUNNER_TEMP/qa-celular-ui"
      - name: Limpar APKs descartáveis da validação de tela
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/qa-celular-ui"

  compilar-manual:
    name: Compilar e validar no ambiente protegido
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'josuepradodeoliveiracosta-gif/atrio-catolico-android' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      github.actor == 'josuepradodeoliveiracosta-gif' &&
      github.run_attempt == 1 && inputs.source_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: qa-geral-celular-assinatura
    env:
      QA_CELULAR_BUILD_KIND: ${{ inputs.build_kind }}
      QA_CELULAR_DELIVER_PAIR: ${{ inputs.deliver_pair }}
      QA_CELULAR_DELIVER_FUNCTIONAL: ${{ inputs.deliver_functional }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Conferir destinatário público da entrega autorizada
        if: inputs.deliver_pair || inputs.deliver_functional
        shell: bash
        env:
          ATRIO_QA_CELULAR_AGE_RECIPIENT: ${{ vars.ATRIO_QA_CELULAR_AGE_RECIPIENT }}
        run: |
          if [[ "$QA_CELULAR_DELIVER_PAIR" == true ]]; then test "$QA_CELULAR_BUILD_KIND" = pair; fi
          if [[ "$QA_CELULAR_DELIVER_FUNCTIONAL" == true ]]; then test "$QA_CELULAR_BUILD_KIND" = functional; fi
          python3 -c 'import os; from scripts.qa_geral_celular_delivery import validate_recipient; validate_recipient(os.environ["ATRIO_QA_CELULAR_AGE_RECIPIENT"])'
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends age
          fi
          age --encrypt --recipient "$ATRIO_QA_CELULAR_AGE_RECIPIENT" /dev/null > /dev/null
      - name: Compilar variante autorizada sem assinatura
        shell: bash
        env:
          ATRIO_QA_CELULAR_GOOGLE_SERVICES_JSON: ${{ inputs.build_kind == 'functional' && secrets.ATRIO_QA_CELULAR_GOOGLE_SERVICES_JSON || '' }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm -f -- app/google-services.json
          if [[ "$QA_CELULAR_BUILD_KIND" == pair ]]; then
            for code in 38 39; do
              bash scripts/qa_geral_celular_manual.sh build "$RUNNER_TEMP/qa-celular-unsigned-$code.apk" "$code"
            done
          elif [[ "$QA_CELULAR_BUILD_KIND" == functional ]]; then
            bash scripts/qa_geral_celular_manual.sh build-functional "$RUNNER_TEMP/qa-celular-unsigned.apk"
            python3 - "$RUNNER_TEMP/qa-celular-unsigned.apk" "$ANDROID_HOME/build-tools/36.0.0" <<'PY'
          from pathlib import Path
          import sys
          from scripts.qa_geral_celular_approve import read_version_code, verify_functional_variant
          from scripts.qa_geral_remote_build_gate import REGISTERED_APP_ID

          apk, sdk = map(Path, sys.argv[1:])
          verify_functional_variant(apk, sdk, read_version_code(apk, sdk), REGISTERED_APP_ID)
          PY
          else
            test "$QA_CELULAR_BUILD_KIND" = single
            bash scripts/qa_geral_celular_manual.sh build "$RUNNER_TEMP/qa-celular-unsigned.apk"
          fi
      - name: Assinar e aprovar apenas com certificado fixado
        id: assinar
        shell: bash
        env:
          ATRIO_QA_CELULAR_AGE_RECIPIENT: ${{ vars.ATRIO_QA_CELULAR_AGE_RECIPIENT }}
          ATRIO_QA_CELULAR_CERT_SHA256: ${{ vars.ATRIO_QA_CELULAR_CERT_SHA256 }}
          ATRIO_QA_CELULAR_KEYSTORE_BASE64: ${{ secrets.ATRIO_QA_CELULAR_KEYSTORE_BASE64 }}
          ATRIO_QA_CELULAR_KEY_ALIAS: ${{ secrets.ATRIO_QA_CELULAR_KEY_ALIAS }}
          ATRIO_QA_CELULAR_STORE_PASSWORD: ${{ secrets.ATRIO_QA_CELULAR_STORE_PASSWORD }}
          ATRIO_QA_CELULAR_KEY_PASSWORD: ${{ secrets.ATRIO_QA_CELULAR_KEY_PASSWORD }}
        run: |
          set +x
          umask 077
          if [[ ! "$ATRIO_QA_CELULAR_CERT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo 'SHA-256 de referência ausente ou inválido.' >&2
            exit 1
          fi
          if [[ "$QA_CELULAR_BUILD_KIND" == functional ]] &&
             [[ "${ATRIO_QA_CELULAR_CERT_SHA256,,}" != 63b26756491bb0103e44e561d63c5481c0d9a6e7374b322ff4e97e1cd5629e57 ]]; then
            echo 'O certificado de referência diverge do APK 39 homologado.' >&2
            exit 1
          fi
          : "${ATRIO_QA_CELULAR_KEYSTORE_BASE64:?Keystore dedicado ausente}"
          work="$(mktemp -d "$RUNNER_TEMP/qa-celular-sign.XXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          printf '%s' "$ATRIO_QA_CELULAR_KEYSTORE_BASE64" | base64 --decode > "$work/qa.keystore"
          unset ATRIO_QA_CELULAR_KEYSTORE_BASE64
          if [[ "$QA_CELULAR_BUILD_KIND" == pair ]]; then
            for code in 38 39; do
              bash scripts/qa_geral_celular_manual.sh sign \
                "$RUNNER_TEMP/qa-celular-unsigned-$code.apk" "$work/candidate-$code.apk" "$work/qa.keystore"
            done
            candidates=(--apk "$work/candidate-38.apk" --update-apk "$work/candidate-39.apk")
          else
            bash scripts/qa_geral_celular_manual.sh sign \
              "$RUNNER_TEMP/qa-celular-unsigned.apk" "$work/candidate.apk" "$work/qa.keystore"
            candidates=(--apk "$work/candidate.apk")
            if [[ "$QA_CELULAR_BUILD_KIND" == functional ]]; then
              candidates+=(--functional)
            fi
          fi
          rm -f -- "$work/qa.keystore"
          unset ATRIO_QA_CELULAR_KEY_ALIAS ATRIO_QA_CELULAR_STORE_PASSWORD ATRIO_QA_CELULAR_KEY_PASSWORD
          python3 -m scripts.qa_geral_celular_approve "${candidates[@]}" \
            --approved-dir "$work/approved" --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$QA_CELULAR_DELIVER_PAIR" == true ]]; then
            test "$QA_CELULAR_BUILD_KIND" = pair
            python3 -m scripts.qa_geral_celular_delivery --approved-dir "$work/approved" \
              --output "$RUNNER_TEMP/atrio-qa-geral-celular-38-39.zip.age" --source-sha "$GITHUB_SHA" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo 'entrega=true' >> "$GITHUB_OUTPUT"
          elif [[ "$QA_CELULAR_DELIVER_FUNCTIONAL" == true ]]; then
            test "$QA_CELULAR_BUILD_KIND" = functional
            python3 -m scripts.qa_geral_celular_delivery --functional --approved-dir "$work/approved" \
              --output "$RUNNER_TEMP/atrio-qa-geral-celular-funcional.zip.age" --source-sha "$GITHUB_SHA" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo 'entrega=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Disponibilizar o par fictício cifrado
        if: inputs.deliver_pair && inputs.build_kind == 'pair' && steps.assinar.outputs.entrega == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atrio-qa-geral-celular-38-39-cifrado
          path: ${{ runner.temp }}/atrio-qa-geral-celular-38-39.zip.age
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Disponibilizar somente o APK funcional cifrado
        if: inputs.deliver_functional && inputs.build_kind == 'functional' && steps.assinar.outputs.entrega == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atrio-qa-geral-celular-funcional-cifrado
          path: ${{ runner.temp }}/atrio-qa-geral-celular-funcional.zip.age
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Limpar APK temporário da compilação
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/qa-celular-unsigned.apk" \
            "$RUNNER_TEMP/qa-celular-unsigned-38.apk" "$RUNNER_TEMP/qa-celular-unsigned-39.apk" \
            "$RUNNER_TEMP/atrio-qa-geral-celular-38-39.zip.age" \
            "$RUNNER_TEMP/atrio-qa-geral-celular-funcional.zip.age" \
            app/src/qaGeral/google-services.json
