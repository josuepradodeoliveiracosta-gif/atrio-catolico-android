name: Testar relay push gratuito

on:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/push-worker/**"
      - "cloudflare/email-verification-policy*.mjs"
      - "cloudflare/worker-email-gate.test.mjs"
      - ".github/workflows/cloudflare-push-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  # Somente commits obsoletos da mesma PR sao cancelados; outros eventos ficam isolados.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes isolados sem Firebase ou Cloudflare de produção
        run: node --test cloudflare/push-worker/src/index.test.js cloudflare/email-verification-policy.test.mjs cloudflare/worker-email-gate.test.mjs
