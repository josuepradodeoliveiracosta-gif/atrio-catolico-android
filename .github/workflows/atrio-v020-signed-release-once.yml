# Execução excepcional autorizada pelo fundador, somente nesta PR.
# Disparo: adição deste próprio arquivo à main. Após a compilação, remover o arquivo.
# Nenhuma alteração nos secrets, na assinatura ou no workflow manual existente.
name: Átrio 0.20.0 — assinatura única autorizada

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atrio-v020-signed-release-once.yml'

permissions:
  contents: read

jobs:
  sign-release:
    if: ${{ github.repository == 'josuepradodeoliveiracosta-gif/atrio-catolico-android' && github.ref == 'refs/heads/main' }}
    name: Assinar 0.20.0 com chave existente — sem publicação externa
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obter código da main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Instalar SDK Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Conferir versão e projeto sem usar credenciais
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq '        versionCode = 35' app/build.gradle.kts
          grep -Fxq '        versionName = "0.20.0"' app/build.gradle.kts
          grep -Fxq '        applicationId = "br.com.atriocatolico"' app/build.gradle.kts
          python3 scripts/validar_firebase.py

      - name: Compilar e verificar APK com assinatura permanente
        shell: bash
        env:
          ATRIO_PUSH_WORKER_URL: ${{ vars.ATRIO_PUSH_WORKER_URL || 'https://atrio-push.atrio-catolico.workers.dev' }}
          ATRIO_AVATAR_WORKER_URL: ${{ vars.ATRIO_AVATAR_WORKER_URL || '' }}
          ATRIO_GUARDIAN_V2_WORKER_URL: https://atrio-guardian-v2.atrio-catolico.workers.dev
          ATRIO_KEYSTORE_BASE64: ${{ secrets.ATRIO_KEYSTORE_BASE64 }}
          ATRIO_STORE_PASSWORD: ${{ secrets.ATRIO_STORE_PASSWORD }}
          ATRIO_KEY_PASSWORD: ${{ secrets.ATRIO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ATRIO_KEYSTORE_BASE64" || -z "$ATRIO_STORE_PASSWORD" || -z "$ATRIO_KEY_PASSWORD" ]]; then
            echo "::error::Assinatura não disponível: secrets obrigatórios ausentes."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/atrio-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ATRIO_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          export ATRIO_SIGNING_STORE_FILE="$KEYSTORE"
          export ATRIO_SIGNING_STORE_PASSWORD="$ATRIO_STORE_PASSWORD"
          export ATRIO_SIGNING_KEY_ALIAS="atrio"
          export ATRIO_SIGNING_KEY_PASSWORD="$ATRIO_KEY_PASSWORD"
          gradle :app:assembleRelease --no-daemon --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"

      - name: Disponibilizar APK assinado por sete dias
        uses: actions/upload-artifact@v4
        with:
          name: atrio-catolico-0.20.0-release-assinado
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
