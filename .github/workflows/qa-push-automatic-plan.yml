name: QA Push automático — contrato local
on:
  pull_request:
    branches: [qa/apk46-clock-skew-20261126]
    paths:
      - 'firebase/qa-geral-celular/pilot/conversation-push-automatic-plan.mjs'
      - 'tests/security/qa-push-automatic-plan.test.mjs'
      - 'firebase/qa-geral-celular/pilot/conversation-push-automatic-emulator.mjs'
      - 'firebase/qa-geral-celular/pilot/conversation-push-automatic-retry-plan.mjs'
      - 'tests/security/qa-push-automatic-retry-plan.test.mjs'
      - 'firebase/qa-geral-celular/pilot/conversation-push-automatic-trigger-lab.mjs'
      - 'tests/security/qa-push-automatic-emulator.test.mjs'
      - 'tests/security/qa-push-automatic-worker-lab.mjs'
      - 'cloudflare/push-worker/scripts/conversation-push-pilot.mjs'
      - 'cloudflare/push-worker/scripts/chat-qa-build.mjs'
      - 'cloudflare/push-worker/scripts/chat-qa-main-adapter.mjs'
      - 'cloudflare/push-worker/src/index.js'
      - 'cloudflare/push-worker/scripts/qa-automatic-service-contract.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-free-discovery.mjs'
      - 'tests/security/qa-automatic-free-discovery.test.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-free-rest-lab.mjs'
      - 'tests/security/qa-automatic-free-rest-lab.test.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-free-publication-lab.mjs'
      - 'tests/security/qa-automatic-free-publication-lab.test.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-free-budget-lab.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-free-snapshot-lab.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-free-claim-lab.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-free-write-guard-lab.mjs'
      - 'tests/security/qa-automatic-free-write-guard-lab.test.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-d1-outbox-lab.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-d1-read-lab.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-d1-dispatch-lab.mjs'
      - 'tests/security/qa-automatic-d1-dispatch-lab.test.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-d1-mode-lab.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-d1-budget-lab.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-d1-metered-lab.mjs'
      - 'tests/security/qa-automatic-d1-budget-lab.test.mjs'
      - 'tests/security/qa-automatic-d1-mode-lab.test.mjs'
      - 'tests/security/qa-automatic-d1-outbox-lab.test.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-free-flow-lab.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-free-meter-lab.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-free-scheduled-lab.mjs'
      - 'tests/security/qa-automatic-free-scheduled-lab.test.mjs'
      - 'tests/security/qa-automatic-lab-isolation.test.mjs'
      - 'tests/security/qa-push-automatic-iam-audit-lib.mjs'
      - 'tests/security/qa-push-automatic-iam-audit.mjs'
      - 'tests/security/qa-push-automatic-iam-audit.test.mjs'
      - 'cloudflare/push-worker/src/qa-geral.js'
      - 'cloudflare/push-worker/scripts/build-conversation-push-pilot.mjs'
      - 'cloudflare/push-worker/wrangler.qa-geral.example.toml'
      - 'tests/security/qa-automatic-free-meter-lab.test.mjs'
      - 'cloudflare/push-worker/scripts/qa-automatic-free-recovery-lab.mjs'
      - 'tests/security/qa-automatic-free-recovery-lab.test.mjs'
      - 'tests/security/qa-automatic-free-budget-lab.test.mjs'
      - 'tests/security/qa-automatic-service-contract.test.mjs'
      - '.github/workflows/qa-push-automatic-plan.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/security/qa-push-automatic-plan.test.mjs tests/security/qa-automatic-service-contract.test.mjs tests/security/qa-push-automatic-retry-plan.test.mjs tests/security/qa-automatic-free-discovery.test.mjs tests/security/qa-automatic-free-rest-lab.test.mjs tests/security/qa-automatic-free-publication-lab.test.mjs tests/security/qa-automatic-free-budget-lab.test.mjs tests/security/qa-automatic-free-recovery-lab.test.mjs tests/security/qa-automatic-free-meter-lab.test.mjs tests/security/qa-automatic-free-scheduled-lab.test.mjs tests/security/qa-automatic-lab-isolation.test.mjs tests/security/qa-push-automatic-iam-audit.test.mjs tests/security/qa-automatic-free-write-guard-lab.test.mjs tests/security/qa-automatic-d1-outbox-lab.test.mjs tests/security/qa-automatic-d1-dispatch-lab.test.mjs tests/security/qa-automatic-d1-mode-lab.test.mjs tests/security/qa-automatic-d1-budget-lab.test.mjs

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Publicação transacional somente no emulador
        working-directory: tests/security
        run: |
          npm ci --ignore-scripts
          node prepare.mjs
          ./node_modules/.bin/firebase emulators:exec --only firestore,auth --project demo-atrio-v11 'node --test qa-push-automatic-emulator.test.mjs'
