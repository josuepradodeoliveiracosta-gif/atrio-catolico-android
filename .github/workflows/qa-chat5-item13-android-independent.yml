name: Chat 5 — Item 13 QA Android independente (sem acesso global)

on:
  pull_request:
    branches: [qa/chat2-199-item13-moderacao-escopo]
    paths:
      - '.github/workflows/qa-chat5-item13-android-independent.yml'
      - 'app/src/androidTest/java/br/com/atriocatolico/AtrioConversasCompostasEmulatorUiTest.kt'

permissions:
  contents: read

concurrency:
  group: qa-chat5-item13-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-item13-independent:
    name: 'Clara, Miguel e Lúcia — denúncia e privacidade'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATRIO_QA_GERAL_BUILD: '1'
      ATRIO_QA_GERAL_CELULAR_PILOT: '1'
      ATRIO_QA_APK: qaGeral
      ATRIO_QA_FIREBASE_PROJECT: demo-atrio-v11
      ATRIO_QA_SUITE: AtrioConversasCompostasEmulatorUiTest
      SOURCE_SHA: c100ad56d97983cef971763aa746184091d50c96
      SOURCE_TREE: ec939d6290f56cb8362b48614132d8976d512900
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Garantir que só os testes de QA diferem da implementação do Chat 2
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree}
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          git diff --check "$SOURCE_SHA" HEAD
          actual="$(git diff --name-only "$SOURCE_SHA" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/workflows/qa-chat5-item13-android-independent.yml' 'app/src/androidTest/java/br/com/atriocatolico/AtrioConversasCompostasEmulatorUiTest.kt' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${ATRIO_PUSH_WORKER_URL:-}"
          echo "Item 13: implementacao/Rules do Chat 2 identicas a #445; somente QA Android mudou."
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
      - name: Compilar variante QA isolada antes do boot
        shell: bash
        run: |
          rm -f -- app/google-services.json
          bash scripts/qa-android-prebuild.sh start
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/security/package-lock.json
      - name: Dependencias fixadas do Firebase Emulator
        run: npm ci --prefix tests/security
      - name: Preparar KVM em VM efemera
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Instrumentar denúncia de grupo, revogação e leitura negada em Android Emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disk-size: 2048M
          ram-size: 2048M
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel on -camera-back none
          script: bash scripts/run-qa-android-emulator.sh
      - name: Verificar pacote e SHA-256 do APK QA, sem assinatura permanente
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/qaGeral/app-qaGeral.apk'
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n1)"
          test "$("$aapt" dump packagename "$apk")" = br.com.atriocatolico.qageral.celular
          sha256sum "$apk"
      - name: Preservar XML, Logcat e logs do Firebase Emulator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-chat5-item13-android-${{ github.event.pull_request.head.sha }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            qa-android-suite-results
            qa-firebase-emulators.log
            qa-android-prebuild.log
          retention-days: 7
          if-no-files-found: warn
