name: QA Android dos três bots (emulador isolado)

# Executar sob demanda: nenhuma interação automática com comunidade oficial.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ui:
    name: Testar telas do Átrio em Android virtual
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validar que não há segredos de produção no ambiente de QA
        run: |
          test -z "${ATRIO_PUSH_WORKER_URL:-}"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          echo "QA offline: os testes Android usam apenas dados de demonstração."
      - name: Rodar interface no emulador Android virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-bots-android-ui-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          retention-days: 7
          if-no-files-found: warn
