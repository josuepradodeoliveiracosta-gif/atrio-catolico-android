name: Guardião V2 — identidade QA manual (leitura única)
on:
  workflow_dispatch:
    inputs:
      confirm_qa:
        description: Confirmo leitura QA autorizada, sem escrita nem deploy
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  qa-wif-one-get:
    if: github.ref != 'refs/heads/qa/guardian-validation-no-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: guardian-qa
    permissions:
      contents: read
      id-token: write
    env:
      QA_FIREBASE_PROJECT_ID: ${{ vars.GUARDIAN_QA_FIREBASE_PROJECT_ID }}
      QA_APPROVED_PROJECT_ID: ${{ vars.GUARDIAN_QA_APPROVED_PROJECT_ID }}
      QA_WIF_PROVIDER: ${{ vars.GUARDIAN_QA_WIF_PROVIDER }}
      QA_SERVICE_ACCOUNT: ${{ vars.GUARDIAN_QA_SERVICE_ACCOUNT }}
      GUARDIAN_V2_TEST_MODE: 'true'
      GUARDIAN_V2_ENABLED: 'false'
      GUARDIAN_V2_HOLD_ENABLED: 'false'
      GUARDIAN_V2_QA_FIRESTORE_BRIDGE: 'false'
      GUARDIAN_V2_QA_SHADOW_READS: 'false'
    steps:
      - name: Exigir confirmação e branch QA antes de solicitar OIDC
        shell: bash
        env:
          CONFIRM_QA: ${{ inputs.confirm_qa }}
        run: |
          set -euo pipefail
          test "$CONFIRM_QA" = 'true'
          test "$GITHUB_REPOSITORY" = 'josuepradodeoliveiracosta-gif/atrio-catolico-android'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/feature/guardiao-v2-wif-prova-qa-20261030'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bloquear contexto indevido antes da credencial WIF
        run: node --input-type=module -e "import {validateQaWifContext} from './cloudflare/guardian-worker/src/qa-wif-probe.js';validateQaWifContext(process.env)"
      - name: Emitir OAuth temporário somente em QA por WIF
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.QA_FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ env.QA_WIF_PROVIDER }}
          service_account: ${{ env.QA_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/datastore
          create_credentials_file: false
      # Próxima prova usa a mesma identidade WIF, mas classifica localmente.
      # Um único GET QA: substitui a sonda, não acrescenta outra consulta.
      - name: Um único GET da fixture QA e classificação somente leitura
        env:
          QA_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node cloudflare/guardian-worker/src/qa-keyless-cycle.js
  remote-qa-rules:
    if: github.ref == 'refs/heads/qa/guardian-validation-no-apk'
    concurrency:
      group: guardian-qa-remote-rules-read
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      CI: 'true'
      GUARDIAN_QA_CONFIRM: ${{ inputs.confirm_qa }}
    steps:
      - name: Validar contexto antes de qualquer autenticacao
        run: |
          set -euo pipefail
          test "$GUARDIAN_QA_CONFIRM" = 'true'
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = josuepradodeoliveiracosta-gif/atrio-catolico-android
          test "$GITHUB_REPOSITORY_ID" = 1432799501
          test "$GITHUB_REPOSITORY_OWNER_ID" = 347622360
          test "$GITHUB_REF" = refs/heads/qa/guardian-validation-no-apk
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar dependencias sem scripts de instalacao
        working-directory: tests/security
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Credencial curta exclusiva de leitura de Rules QA
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: atrio-catolico-qa-v2
          workload_identity_provider: projects/53068022813/locations/global/workloadIdentityPools/guardian-qa-rules-ci/providers/github-rules-ci
          service_account: guardian-qa-rules-ci@atrio-catolico-qa-v2.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false
      - name: Ler Rules publicadas e comparar localmente sem logs privados
        env:
          QA_RULES_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 -u scripts/guardian_qa_remote_rules_ci.py
