name: Validar selos (Android e Firestore)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Uma atualização não pode interromper um teste já iniciado.
  # O GitHub poderá substituir somente uma execução ainda pendente.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Regras de seguranca Firestore
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Preparar Java para emulador
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependencias dos testes
        working-directory: tests/security
        run: npm ci
      - name: Testar regras do Firestore no emulador (sem acessar producao)
        working-directory: tests/security
        run: npm test

  android:
    name: Compilar Android de testes
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configurar Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
      - name: Instalar plataforma Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validar configuracao Firebase
        run: python3 scripts/validar_firebase.py
      - name: Compilar sem alterar a assinatura de producao
        env:
          ATRIO_PUSH_WORKER_URL: ${{ vars.ATRIO_PUSH_WORKER_URL || 'https://atrio-push.atrio-catolico.workers.dev' }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Disponibilizar APK debug apenas para testes da PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atrio-catolico-v0190-debug-testes
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

