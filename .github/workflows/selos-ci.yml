name: Validar selos (Android e Firestore)

on:
  pull_request:
    branches: [main]
  # QA isolado da PR #15: apenas este ramo, sem deploy nem release.
  push:
    branches: [feature/push-gratuito-cloudflare-v0190]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Uma atualização não pode interromper um teste já iniciado.
  # O GitHub poderá substituir somente uma execução ainda pendente.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  documentation_scope:
    name: Classificar PR documental antes do APK adicional
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - name: Obter classificador confiavel da base da PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Testar classificacao fail-closed offline
        run: python3 -m unittest discover -s scripts -p 'test_ci_documentation_scope.py' -v
      - name: Conferir SHAs e classificar diff sem executar codigo da PR
        id: classify
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          heavy=true
          trap 'printf "heavy=%s\n" "$heavy" >> "$GITHUB_OUTPUT"' EXIT
          [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]] || exit 0
          [[ "$GITHUB_REPOSITORY" == 'josuepradodeoliveiracosta-gif/atrio-catolico-android' ]] || exit 0
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 0
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 0
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || exit 0
          [[ "$(git rev-parse --is-shallow-repository)" == 'false' ]] || exit 0
          [[ "$(git rev-parse HEAD)" == "$PR_BASE_SHA" ]] || exit 0
          git fetch --no-tags --force origin "refs/pull/${PR_NUMBER}/head" || exit 0
          [[ "$(git rev-parse FETCH_HEAD)" == "$PR_HEAD_SHA" ]] || exit 0
          base="$(git merge-base --all "$PR_BASE_SHA" "$PR_HEAD_SHA")" || exit 0
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || exit 0
          git diff --raw -z --no-ext-diff "$base" "$PR_HEAD_SHA" > "$RUNNER_TEMP/atrio-pr-diff.raw" || exit 0
          result="$(python3 scripts/ci_documentation_scope.py --raw-diff-z "$RUNNER_TEMP/atrio-pr-diff.raw" --event pull_request --comparison-verified)" || exit 0
          if [[ "$result" == 'heavy=false' ]]; then
            heavy=false
            echo 'PR apenas documental e diff confiavel: compilacao APK redundante dispensada.'
          fi
  firestore-rules:
    needs: documentation_scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.documentation_scope.outputs.heavy != 'false') }}
    name: Regras de seguranca Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/security/package-lock.json
      - name: Preparar Java para emulador
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependencias dos testes
        working-directory: tests/security
        run: npm ci
      - name: Testar regras do Firestore no emulador (sem acessar producao)
        working-directory: tests/security
        run: npm test
      - name: Testar preflight dos selos V2 em modo totalmente offline
        # Mocks locais: não usa login Firebase nem acessa o projeto real.
        run: node --test scripts/selos-v2-production-preflight.test.mjs
      - name: Validar proteções do procedimento de publicação sem acessar produção
        # O teste simula Firebase CLI: não utiliza token nem envia alterações.
        run: node --test scripts/selos-v2-production-guarded-deploy.test.mjs
      - name: Testar ativação do Fundador com simulação local
        # Todos os tokens, documentos e chamadas HTTP são simulados.
        run: node --test scripts/termux-founder-access-guard.test.mjs

  android:
    needs: documentation_scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.documentation_scope.outputs.heavy != 'false') }}
    name: Compilar Android de testes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar plataforma Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validar configuracao Firebase
        run: python3 scripts/validar_firebase.py
      - name: Compilar sem alterar a assinatura de producao
        env:
          ATRIO_PUSH_WORKER_URL: ${{ vars.ATRIO_PUSH_WORKER_URL || 'https://atrio-push.atrio-catolico.workers.dev' }}
          ATRIO_AVATAR_WORKER_URL: ${{ vars.ATRIO_AVATAR_WORKER_URL || '' }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Disponibilizar APK debug apenas para testes da PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: atrio-catolico-v0190-debug-testes
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

