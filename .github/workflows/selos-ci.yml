name: Validar selos (Android e Firestore)

on:
  pull_request:
    branches: [main]
  # QA isolado da PR #15: apenas este ramo, sem deploy nem release.
  push:
    branches: [feature/push-gratuito-cloudflare-v0190]
  workflow_dispatch:

concurrency:
  group: atrio-selos-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  # Apenas commits antigos da mesma PR podem ser cancelados; push e manual permanecem.
  # O commit mais recente sempre recebe novos checks obrigatorios completos.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Regras de seguranca Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verificar contratos de CI, selecao e metricas offline
        run: |
          python3 -m unittest scripts.test_ci_optimization_contract scripts.test_ci_worker_scope scripts.test_ci_worker_scope_integration scripts.test_ci_quality_report scripts.test_ci_diagnostic_snapshot scripts.test_ci_log_identity_verifier scripts.test_ci_log_safe_analysis scripts.test_ci_failure_classifier scripts.test_ci_diagnostic_replay scripts.test_ci_diagnostic_evaluation scripts.test_ci_autofix_policy scripts.test_ci_autofix_sandbox scripts.test_ci_autofix_qa_review scripts.test_ci_autofix_handoff scripts.test_ci_autofix_pr_draft_plan scripts.test_ci_autofix_pr_draft_executor scripts.test_ci_autofix_automatic_gate scripts.test_ci_autofix_app_token_readonly_smoke scripts.test_ci_autofix_doc_candidate scripts.test_ci_latency_audit scripts.test_codeql_review_workflow scripts.test_dependency_review_contract -v
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          # Dependencias do emulador atualmente exigem Node.js >=22.
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/security/package-lock.json
      - name: Preparar Java para emulador
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependencias dos testes
        working-directory: tests/security
        run: npm ci
      - name: Testar regras do Firestore no emulador (sem acessar producao)
        working-directory: tests/security
        run: npm test
      - name: Testar preflight dos selos V2 em modo totalmente offline
        # Mocks locais: não usa login Firebase nem acessa o projeto real.
        run: node --test scripts/selos-v2-production-preflight.test.mjs
      - name: Validar proteções do procedimento de publicação sem acessar produção
        # O teste simula Firebase CLI: não utiliza token nem envia alterações.
        run: node --test scripts/selos-v2-production-guarded-deploy.test.mjs
      - name: Testar ativação do Fundador com simulação local
        # Todos os tokens, documentos e chamadas HTTP são simulados.
        run: node --test scripts/termux-founder-access-guard.test.mjs

  android:
    name: Compilar Android de testes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Configurar Gradle 8.13
        # v5.0.2: Node 24, SHA imutavel, mantendo cache GitHub existente.
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.13'
      - name: Instalar plataforma Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validar configuracao Firebase
        run: python3 scripts/validar_firebase.py
      - name: Compilar sem alterar a assinatura de producao
        env:
          ATRIO_PUSH_WORKER_URL: ${{ vars.ATRIO_PUSH_WORKER_URL || 'https://atrio-push.atrio-catolico.workers.dev' }}
          ATRIO_AVATAR_WORKER_URL: ${{ vars.ATRIO_AVATAR_WORKER_URL || '' }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Disponibilizar APK debug apenas para testes da PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          # Preserva o ZIP do artefato e seu nome tradicional; sem upload direto.
          archive: true
          name: atrio-catolico-v0190-debug-testes
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

