name: Validar selos (Android e Firestore)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Regras de seguranca Firestore
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preparar Java para emulador
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependencias dos testes
        working-directory: tests/security
        run: npm ci
      - name: Testar regras do Firestore no emulador (sem acessar producao)
        working-directory: tests/security
        run: npm test

  android:
    name: Compilar Android de testes
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar plataforma Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validar configuracao Firebase
        run: python3 scripts/validar_firebase.py
      - name: Compilar sem alterar a assinatura de producao
        env:
          ATRIO_PUSH_WORKER_URL: ${{ vars.ATRIO_PUSH_WORKER_URL || 'https://atrio-push.atrio-catolico.workers.dev' }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Disponibilizar APK debug apenas para testes da PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: atrio-catolico-v0190-debug-testes
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

