name: Validar selos (Android e Firestore)

on:
  pull_request:
    branches: [main]
  # QA isolado da PR #15: apenas este ramo, sem deploy nem release.
  push:
    branches: [feature/push-gratuito-cloudflare-v0190]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Uma atualização não pode interromper um teste já iniciado.
  # O GitHub poderá substituir somente uma execução ainda pendente.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Regras de seguranca Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preparar Java para emulador
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependencias dos testes
        working-directory: tests/security
        run: npm ci
      - name: Testar regras do Firestore no emulador (sem acessar producao)
        working-directory: tests/security
        run: npm test
      - name: Preparar Node 22 para QA administrativo (SQLite e Firebase Admin)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Firebase Admin exclusivamente na fixture
        working-directory: tests/security
        run: npm install --prefix admin-fixture --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Testar exclusao apenas em emuladores e HTTP localhost
        working-directory: tests/security
        shell: bash
        env:
          GCLOUD_PROJECT: demo-atrio-v11
        run: |
          set -euo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          test -z "${CLOUDINARY_API_SECRET:-}"
          test -z "${CLOUDINARY_API_KEY:-}"
          node prepare.mjs
          npx firebase emulators:exec --only firestore,auth --project demo-atrio-v11 \
            "node relational-inventory-emulator.test.mjs && node --experimental-sqlite qa-deletion-auth-fence.test.mjs && node --experimental-sqlite qa-deletion-emulator.test.mjs && node --experimental-sqlite qa-auth-cloudinary-emulator.test.mjs && env -u FIREBASE_CONFIG node --experimental-sqlite admin-fixture/qa-worker-drain.test.mjs && env -u FIREBASE_CONFIG node --experimental-sqlite admin-fixture/qa-avatar-d1-pre-auth.test.mjs && env -u FIREBASE_CONFIG node --experimental-sqlite admin-fixture/qa-retention-evidence.test.mjs && env -u FIREBASE_CONFIG node --experimental-sqlite admin-fixture/qa-admin-sdk-e2e.test.mjs && node account-deletion-freeze.test.mjs"

  android:
    name: Compilar Android de testes
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar plataforma Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validar configuracao Firebase
        run: python3 scripts/validar_firebase.py
      - name: Compilar sem alterar a assinatura de producao
        env:
          ATRIO_PUSH_WORKER_URL: ${{ vars.ATRIO_PUSH_WORKER_URL || 'https://atrio-push.atrio-catolico.workers.dev' }}
          ATRIO_AVATAR_WORKER_URL: ${{ vars.ATRIO_AVATAR_WORKER_URL || '' }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Disponibilizar APK debug apenas para testes da PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: atrio-catolico-v0190-debug-testes
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

