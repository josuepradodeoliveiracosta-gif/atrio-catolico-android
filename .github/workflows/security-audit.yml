name: Segurança do repositório público

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-audit:
    name: Bloquear arquivos sensíveis e segredos rastreados
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código sem reter credenciais
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Testar detector e lista de arquivos proibidos
        run: python3 -m unittest discover -s scripts -p test_security_audit.py -v
      - name: Inspecionar arquivos versionados sem imprimir segredos
        run: python3 scripts/security_audit.py
