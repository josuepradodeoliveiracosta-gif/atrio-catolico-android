name: Segurança do repositório público

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nenhuma credencial de usuário ou de assinatura é repassada a este workflow.
permissions:
  contents: read

jobs:
  scan-public-code:
    name: Detectar segredos em arquivos e histórico Git
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código e histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar arquivos e objetos históricos sem imprimir credenciais
        run: python3 scripts/check_public_secrets.py --history
      - name: Testar política fail-closed dos workflows offline
        run: python3 -m unittest scripts.test_ci_workflow_security scripts.test_ota_release_gate -v
      - name: Bloquear permissões globais e gatilhos privilegiados não autorizados
        run: python3 scripts/ci_workflow_security.py
