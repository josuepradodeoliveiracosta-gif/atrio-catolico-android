name: Relatório consolidado de CI por commit (somente leitura)

# Um snapshot por ciclo de CodeQL, normalmente a analise mais longa.
# Resultado informativo: outros checks ainda podem estar em andamento.
on:
  workflow_run:
    workflows:
      - Revisão automática - CodeQL (Kotlin, JS, Python e Actions)
    types: [completed]
  workflow_dispatch:
    inputs:
      qa_historical_replay:
        description: 'QA somente: analisar falha historica conhecida, sem criar erros'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  snapshot:
    name: Consolidar checks do SHA sem modificar a PR
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Testar relator e consolidacao de diagnosticos em memoria
        run: python3 -m unittest scripts.test_ci_quality_report scripts.test_ci_diagnostic_snapshot scripts.test_ci_log_identity_verifier scripts.test_ci_log_safe_analysis -v
      - name: Buscar checks e anexar sintese sem alterar APIs remotas
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          CI_QA_HISTORICAL_REPLAY: ${{ inputs.qa_historical_replay && 'true' || 'false' }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$CI_QA_HISTORICAL_REPLAY" == "true" ]]; then
            # Replay read-only of an already failed historical job; never trigger
            # outside this specific QA branch. Not a PR-HEAD freshness check.
            if [[ "$CI_EVENT_NAME" != "workflow_dispatch" || "$CI_REF_NAME" != "feat/qa-diagnostics-integration-20261112" ]]; then
              echo "::error::Replay historico permitido somente no workflow manual da branch QA isolada."
              exit 1
            fi
            CI_TARGET_SHA="e046f3c3609b8fee5e7b0064646ec174ab3ca2d3"
            echo "QA historico read-only: consultando o SHA fixo de falha anterior (nao e HEAD atual)."
          fi
          python3 scripts/ci_quality_report.py \
            --sha "$CI_TARGET_SHA" \
            --json ci-report.json \
            --markdown ci-report.md
          # Reutiliza JSON ja coletado: nenhuma chamada de API adicional.
          python3 -m scripts.ci_diagnostic_snapshot \
            --report-json ci-report.json \
            --output-json ci-diagnostics.json \
            --markdown ci-report.md
          # Consulta apenas metadados de job/run usando as mesmas permissoes de leitura.
          # Nao acessa logs, nao publica conteudo remoto e nunca corrige falhas.
          python3 -m scripts.ci_log_identity_verifier \
            --diagnostics ci-diagnostics.json \
            --json ci-job-evidence.json \
            --markdown ci-report.md
          # No maximo 3 logs de jobs ja verificados, ate 2MB cada, em memoria.
          # O relatorio publica somente IDs de regras; nunca copia linhas de log.
          python3 -m scripts.ci_log_safe_analysis \
            --diagnostics ci-diagnostics.json \
            --identity ci-job-evidence.json \
            --json ci-log-signals.json \
            --markdown ci-report.md
          cat ci-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preservar relatorio por execucao
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-readonly-${{ github.run_id }}
          path: |
            ci-report.json
            ci-diagnostics.json
            ci-job-evidence.json
            ci-log-signals.json
            ci-report.md
          retention-days: 14
          if-no-files-found: warn
