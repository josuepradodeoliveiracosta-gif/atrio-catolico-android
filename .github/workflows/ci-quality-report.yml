name: Relatório consolidado de CI por commit (somente leitura)

# Um snapshot por ciclo de CodeQL, normalmente a analise mais longa.
# Resultado informativo: outros checks ainda podem estar em andamento.
on:
  workflow_run:
    workflows:
      - Revisão automática - CodeQL (Kotlin, JS, Python e Actions)
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  snapshot:
    name: Consolidar checks do SHA sem modificar a PR
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Testar relator e consolidacao de diagnosticos em memoria
        run: python3 -m unittest scripts.test_ci_quality_report scripts.test_ci_diagnostic_snapshot -v
      - name: Buscar checks e anexar sintese sem alterar APIs remotas
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci_quality_report.py \
            --sha "$CI_TARGET_SHA" \
            --json ci-report.json \
            --markdown ci-report.md
          # Reutiliza JSON ja coletado: nenhuma chamada de API adicional.
          python3 -m scripts.ci_diagnostic_snapshot \
            --report-json ci-report.json \
            --output-json ci-diagnostics.json \
            --markdown ci-report.md
          cat ci-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preservar relatorio por execucao
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-readonly-${{ github.run_id }}
          path: |
            ci-report.json
            ci-diagnostics.json
            ci-report.md
          retention-days: 14
          if-no-files-found: warn
