name: QA — ajuste de luminosidade das telas de entrada
on:
  push:
    branches: [qa/glassmorphism-padrao-cadastro-ajuste]
    paths:
      - '.github/workflows/qa-standard-preauth-glass.yml'
permissions:
  contents: read
jobs:
  android-ui:
    if: github.repository == 'josuepradodeoliveiracosta-gif/atrio-catolico-android' && github.ref == 'refs/heads/qa/glassmorphism-padrao-cadastro-ajuste'
    name: Entrada — comparação do vidro e contraste
    runs-on: ubuntu-latest
    env:
      ATRIO_QA_SUITE: PreAuthEntranceGlass
      ATRIO_QA_APK: qaGeral
      ATRIO_QA_GERAL_BUILD: '1'
      ATRIO_QA_FIREBASE_PROJECT: demo-atrio-v11
    timeout-minutes: 45
    steps:
      # A revisão padrão do evento mantém a PR no ref de teste do GitHub.
      - name: Obter revisão do evento
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0d9685e101d924a13d97def6f13171850f003dc2
          persist-credentials: false
      - name: Conferir SHA e árvore do candidato
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0d9685e101d924a13d97def6f13171850f003dc2"
          test "$(git rev-parse HEAD^{tree})" = "10eb022aab45156f3aac0f662433eb4e7049b583"
      - name: Registrar o commit executado pela suíte
        run: git rev-parse HEAD
      - name: Preparar Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
          cache-disabled: true
      # A compilacao pesada comeca antes do boot e do npm ci.
      # A VM e efemera; segredos e google-services.json nao entram no APK.
      - name: Isolar Firebase antes de iniciar a compilacao
        shell: bash
        run: |
          test "$ATRIO_QA_APK" = 'qaGeral'
          test "$ATRIO_QA_GERAL_BUILD" = '1'
          test "$ATRIO_QA_FIREBASE_PROJECT" = 'demo-atrio-v11'
          test -z "${ATRIO_CHAT_QA_BUILD:-}"
          test -z "${ATRIO_PERFIL_QA_BUILD:-}"
          for key in ATRIO_PUSH_WORKER_URL ATRIO_GUARDIAN_V2_WORKER_URL ATRIO_AVATAR_WORKER_URL GOOGLE_APPLICATION_CREDENTIALS ATRIO_SIGNING_STORE_FILE ATRIO_SIGNING_STORE_PASSWORD ATRIO_SIGNING_KEY_ALIAS ATRIO_SIGNING_KEY_PASSWORD; do
            if [[ -n "${!key:-}" ]]; then
              echo "QA offline: variavel de producao proibida: $key" >&2
              exit 2
            fi
          done
          for config in app/src/qaGeral/google-services.json app/src/chatQa/google-services.json app/src/perfilQa/google-services.json; do
            if [[ -e "$config" ]]; then
              echo "QA Geral: configuracao de variante diferente detectada" >&2
              exit 2
            fi
          done
          if [[ -e app/google-services.json ]]; then
            echo "Removendo google-services.json somente no checkout efemero do CI"
            rm -- app/google-services.json
          fi
          test ! -e app/google-services.json
      - name: Iniciar compilacao APK QA Geral enquanto o emulador inicializa
        run: bash scripts/qa-android-prebuild.sh start
      - name: Preparar Node.js para Firebase Emulator Suite
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Validar plano de grupos offline
        run: python3 -m unittest discover -s scripts -p 'test_qa_android_*.py' -v
      - name: Instalar Firebase CLI de testes
        working-directory: tests/security
        run: npm ci
      - name: Validar que não há segredos de produção no ambiente de QA
        run: |
          test -z "${ATRIO_PUSH_WORKER_URL:-}"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          echo "QA offline: os testes Android usam apenas dados de demonstração."
      # O emulador x86_64 precisa de aceleração KVM; sem ela o Android
      # não conclui o boot em CI e nenhum teste de toque chega a iniciar.
      - name: Habilitar KVM para emulador Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm || { echo "KVM não disponível no runner"; exit 1; }
          # Alguns runners mantêm as permissões antigas após o udev trigger.
          # Essa permissão vale só para a VM efêmera de CI, nunca para produção.
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm || { echo "Acesso negado ao /dev/kvm"; exit 1; }
      - name: Rodar interface no emulador Android virtual
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          # O AVD padrão exige >7 GB só para userdata no runner.
          # 2 GB comporta o APK debug e os emuladores locais de QA.
          disk-size: 2048M
          ram-size: 2048M
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel on -camera-back none
          script: bash scripts/run-qa-android-emulator.sh
      - name: Teste JVM somente do contraste escuro de entrada
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/glass-modal-filter.gradle" <<'GROOVY'
          gradle.beforeProject { p ->
              p.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
                  if (name == 'testQaGeralUnitTest') {
                      filter {
                          includeTestsMatching 'br.com.atriocatolico.PreAuthGlassPolicyTest.entranceDarkGlassKeepsSixLiturgicalButtonsAndTextReadableOverAnyArt'
                          failOnNoMatchingTests = true
                      }
                  }
              }
          }
          GROOVY
          gradle --init-script "$RUNNER_TEMP/glass-modal-filter.gradle" :app:testQaGeralUnitTest --no-daemon
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          reports = list(pathlib.Path('app/build/test-results/testQaGeralUnitTest').glob('TEST-*.xml'))
          assert len(reports) == 1, reports
          suite = ET.parse(reports[0]).getroot()
          assert suite.get('name') == 'br.com.atriocatolico.PreAuthGlassPolicyTest'
          assert suite.get('tests') == '1', suite.attrib
          assert all(suite.get(k) == '0' for k in ('failures', 'errors', 'skipped')), suite.attrib
          assert suite.find('testcase').get('name') == 'entranceDarkGlassKeepsSixLiturgicalButtonsAndTextReadableOverAnyArt'
          PY
      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-standard-preauth-glass-ajuste
          path: |
            app/build/test-results/testQaGeralUnitTest
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            qa-android-suite-results
            qa-firebase-emulators.log
            qa-android-prebuild.log
            qa-android-prebuild.status
          retention-days: 7
          if-no-files-found: warn
