name: APK QA Geral Celular

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/qa-geral-celular.yml
      - app/build.gradle.kts
      - app/src/main/**
      - app/src/qaGeral/**
      - scripts/qa_geral_remote_build_gate.py

permissions:
  contents: read

jobs:
  compilar-qa-geral-celular:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["qa/chat5-qa-geral-firebase-celular","qa/chat5-qa-geral-registro-push","qa/chat7-qa-geral-composicao-integrada","qa/chat7-qa-geral-celular-forum-integrado"]'), github.head_ref)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ATRIO_QA_GERAL_BUILD: '1'
      ATRIO_QA_GERAL_REMOTE_BUILD: '1'
      ATRIO_QA_GERAL_PUSH_BUILD: ${{ github.head_ref != 'qa/chat5-qa-geral-firebase-celular' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
          cache-read-only: true
      - name: Preparar configuração Firebase do build
        id: configuracao
        shell: bash
        env:
          ATRIO_QA_CONFIG: ${{ github.head_ref == 'qa/chat5-qa-geral-firebase-celular' && secrets.ATRIO_QA_GENERAL_GOOGLE_SERVICES_JSON || '' }}
        run: |
          rm -f -- app/google-services.json
          config=app/src/qaGeral/google-services.json
          test ! -e "$config"
          test ! -L "$config"
          if [[ "$ATRIO_QA_GERAL_PUSH_BUILD" == 1 ]]; then
            test -z "$ATRIO_QA_CONFIG"
          fi
          if [[ -n "$ATRIO_QA_CONFIG" ]]; then
            printf '%s' "$ATRIO_QA_CONFIG" > "$config"
            echo 'real=true' >> "$GITHUB_OUTPUT"
          else
            python3 - "$config" <<'PY'
          import json
          from pathlib import Path
          import sys

          config = {
              "project_info": {
                  "project_number": "835727158563",
                  "project_id": "atrio-catolico-qa-general"
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:835727158563:android:618218ab4be326d75cb096",
                      "android_client_info": {"package_name": "br.com.atriocatolico.qageral"}
                  },
                  "api_key": [{"current_key": "chave-ficticia-apenas-para-compilacao"}]
              }],
              "configuration_version": "1"
          }
          Path(sys.argv[1]).write_text(json.dumps(config), encoding="utf-8")
          PY
            echo 'real=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Compilar e conferir a identidade do APK
        env:
          CONFIG_REAL: ${{ steps.configuracao.outputs.real }}
        shell: bash
        run: |
          gradle :app:assembleQaGeral --no-daemon --max-workers=2
          shopt -s nullglob
          apks=(app/build/outputs/apk/qaGeral/*.apk)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/qa-geral-badging.txt"
          grep -F "package: name='br.com.atriocatolico.qageral'" "$RUNNER_TEMP/qa-geral-badging.txt"
          grep -F "application-label:'Átrio Católico · QA Geral Celular'" "$RUNNER_TEMP/qa-geral-badging.txt"
          "$tools/aapt" dump --values resources "$apk" > "$RUNNER_TEMP/qa-geral-resources.txt"
          grep -Fq 'atrio-catolico-qa-general' "$RUNNER_TEMP/qa-geral-resources.txt"
          grep -Fq '1:835727158563:android:618218ab4be326d75cb096' "$RUNNER_TEMP/qa-geral-resources.txt"
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/qa-geral-certificado.txt"
          grep -E '^Signer #[0-9]+ certificate SHA-256 digest: [[:xdigit:]]{64}
          if [[ "$ATRIO_QA_GERAL_PUSH_BUILD" == 1 ]]; then
            "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/qa-geral-manifest.txt"
            grep -Fq 'br.com.atriocatolico.AtrioPushService' "$RUNNER_TEMP/qa-geral-manifest.txt"
            grep -Fq 'android.permission.POST_NOTIFICATIONS' "$RUNNER_TEMP/qa-geral-manifest.txt"
            ! grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' "$RUNNER_TEMP/qa-geral-manifest.txt"
            test "$CONFIG_REAL" = false
          fi
          if [[ "$CONFIG_REAL" == true ]]; then
            mkdir qa-geral-celular
            cp "$apk" qa-geral-celular/atrio-qa-geral-celular.apk
            git rev-parse HEAD > qa-geral-celular/ORIGEM.txt
            (cd qa-geral-celular && sha256sum atrio-qa-geral-celular.apk | tee SHA256SUMS)
          else
            echo 'Build validado com configuração fictícia. APK de instalação requer a configuração do Firebase de QA.'
          fi
      - name: Guardar APK de homologação
        if: steps.configuracao.outputs.real == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atrio-qa-geral-celular
          path: qa-geral-celular/
          if-no-files-found: error
          retention-days: 7
 "$RUNNER_TEMP/qa-geral-certificado.txt"
          if [[ "$ATRIO_QA_GERAL_PUSH_BUILD" == 1 ]]; then
            "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/qa-geral-manifest.txt"
            grep -Fq 'br.com.atriocatolico.AtrioPushService' "$RUNNER_TEMP/qa-geral-manifest.txt"
            grep -Fq 'android.permission.POST_NOTIFICATIONS' "$RUNNER_TEMP/qa-geral-manifest.txt"
            ! grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' "$RUNNER_TEMP/qa-geral-manifest.txt"
            test "$CONFIG_REAL" = false
          fi
          if [[ "$CONFIG_REAL" == true ]]; then
            mkdir qa-geral-celular
            cp "$apk" qa-geral-celular/atrio-qa-geral-celular.apk
            git rev-parse HEAD > qa-geral-celular/ORIGEM.txt
            (cd qa-geral-celular && sha256sum atrio-qa-geral-celular.apk | tee SHA256SUMS)
          else
            echo 'Build validado com configuração fictícia. APK de instalação requer a configuração do Firebase de QA.'
          fi
      - name: Guardar APK de homologação
        if: steps.configuracao.outputs.real == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atrio-qa-geral-celular
          path: qa-geral-celular/
          if-no-files-found: error
          retention-days: 7
