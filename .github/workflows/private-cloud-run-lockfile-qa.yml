name: QA privado Cloud Run — dependências reproduzíveis (sem deploy)

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/cloud-run-private-review/**'
      - '.github/workflows/private-cloud-run-lockfile-qa.yml'

permissions:
  contents: read

concurrency:
  group: private-read-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  locked-container:
    if: github.repository == 'josuepradodeoliveiracosta-gif/atrio-catolico-android'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Código sem token persistido
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar lockfile de revisão isolada, sem segredos
        if: ${{ hashFiles('ops/cloud-run-private-review/package-lock.json') == '' }}
        working-directory: ops/cloud-run-private-review
        shell: bash
        env:
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          set -euo pipefail
          test ! -e .env && test ! -e credentials.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json');if(p.lockfileVersion!==3||p.packages[''].dependencies['firebase-admin']!=='14.5.0')process.exit(2)"
          echo 'ATRIO_LOCKFILE_BASE64_BEGIN'
          base64 -w 512 package-lock.json
          echo 'ATRIO_LOCKFILE_BASE64_END'
          sha256sum package-lock.json
          echo 'Bloqueio: este job NÃO publica artefatos, não acessa produção e não assina nada.'
      - name: Validar lockfile versionado (quando estiver disponível)
        if: ${{ hashFiles('ops/cloud-run-private-review/package-lock.json') != '' }}
        working-directory: ops/cloud-run-private-review
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env && test ! -e credentials.json
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json');if(p.lockfileVersion!==3||p.packages[''].dependencies['firebase-admin']!=='14.5.0')process.exit(2)"
          node --check server.mjs
          echo 'Instalação reprodutível validada; ainda falta imagem por digest, IAM e deploy.'
