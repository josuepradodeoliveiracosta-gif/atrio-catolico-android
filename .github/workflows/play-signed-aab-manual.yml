name: Google Play — gerar AAB assinado aprovado (manual, sem publicar)

# Jamais disparar por push/PR. O Play Console continua sendo operado pelo responsável.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite exatamente GERAR AAB PLAY depois de validar a chave e a candidata'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: atrio-play-aab-signed-manual
  cancel-in-progress: false

jobs:
  signed-play-bundle:
    if: >-
      github.repository == 'josuepradodeoliveiracosta-gif/atrio-catolico-android' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'GERAR AAB PLAY'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAY_AAB_APPROVED: ${{ vars.ATRIO_PLAY_AAB_APPROVED || 'false' }}
      ATRIO_PLAY_UPLOAD_CERT_SHA256: ${{ vars.ATRIO_PLAY_UPLOAD_CERT_SHA256 || '' }}
      ATRIO_PLAY_APP_SIGNING_CERT_SHA256: ${{ vars.ATRIO_PLAY_APP_SIGNING_CERT_SHA256 || '' }}
      ATRIO_INSTALLED_APK_CERT_SHA256: ${{ vars.ATRIO_INSTALLED_APK_CERT_SHA256 || '' }}
      ATRIO_PRIVACY_POLICY_URL: ${{ vars.ATRIO_PLAY_PRIVACY_POLICY_URL || '' }}
      ATRIO_DELETION_PORTAL_URL: ${{ vars.ATRIO_PLAY_DELETION_PORTAL_URL || '' }}
      # Opt-in only. Default keeps the Firebase deletion portal gate unchanged.
      ATRIO_PLAY_DELETION_MODE: ${{ vars.ATRIO_PLAY_DELETION_MODE || 'firebase' }}
      ATRIO_PLAY_SUPPORT_EMAIL: ${{ vars.ATRIO_PLAY_SUPPORT_EMAIL || '' }}
      ATRIO_PLAY_SUPPORT_REVIEWED: ${{ vars.ATRIO_PLAY_SUPPORT_REVIEWED || '' }}
      ATRIO_PLAY_SUPPORT_MAILBOX_MONITORED: ${{ vars.ATRIO_PLAY_SUPPORT_MAILBOX_MONITORED || 'false' }}
      GUARDIAN_APPROVED: ${{ vars.ATRIO_GUARDIAN_V2_RELEASE_APPROVED || 'false' }}
      GUARDIAN_URL: ${{ vars.ATRIO_GUARDIAN_V2_WORKER_URL || '' }}
      ATRIO_PUSH_WORKER_URL: ${{ vars.ATRIO_PUSH_WORKER_URL || 'https://atrio-push.atrio-catolico.workers.dev' }}
      ATRIO_AVATAR_WORKER_URL: ${{ vars.ATRIO_AVATAR_WORKER_URL || '' }}
      ATRIO_GUARDIAN_V2_WORKER_URL: ${{ vars.ATRIO_GUARDIAN_V2_WORKER_URL || 'https://atrio-guardian-v2.atrio-catolico.workers.dev' }}
    steps:
      - name: Validar aprovações de Play e do backend antes de obter segredos
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PLAY_AAB_APPROVED" == "true" ]] || {
            echo "::error::AAB bloqueado: aprovação Play ausente (ATRIO_PLAY_AAB_APPROVED)"
            exit 1
          }
          [[ "$GUARDIAN_APPROVED" == "true" ]] || {
            echo "::error::AAB bloqueado: Guardião V2 ainda não aprovado"
            exit 1
          }
          [[ "$GUARDIAN_URL" == "https://atrio-guardian-v2.atrio-catolico.workers.dev" ]] || {
            echo "::error::AAB bloqueado: backend Guardião oficial não homologado"
            exit 1
          }
      - name: Bloquear chave de upload sem certificado previamente aprovado
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ATRIO_PLAY_UPLOAD_CERT_SHA256" =~ ^([0-9A-Fa-f]{64}|([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2})$ ]] || {
            echo "::error::Configurar SHA-256 do certificado PUBLICO de upload antes da assinatura."
            exit 1
          }
      - name: Obter código
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bloquear assinatura em caso de privacidade, versao ou variante inseguras
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_play_release_gate.py' -v
          python3 -m unittest discover -s scripts -p 'test_play_upload_certificate_check.py' -v
          python3 -m unittest discover -s scripts -p 'test_play_app_signing_continuity.py' -v
          python3 scripts/play_app_signing_continuity.py
          python3 scripts/play_release_gate.py --enforce
      # Reusar a suite de exclusão REAL no Firebase Emulator antes de permitir
      # que qualquer segredo de assinatura seja lido pelo job manual.
      # Exclusivamente projeto demo, Auth e Firestore locais, Cloudinary HTTP local.
      - name: Preparar Java 17 para Firebase Emulator e Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Node 22 para homologação administrativa de exclusão
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar opção de suporte por e-mail antes de qualquer assinatura
        shell: bash
        run: |
          set -euo pipefail
          node --test cloudflare/account-deletion-support/build.test.mjs
          if [[ "$ATRIO_PLAY_DELETION_MODE" == 'manual-support' ]]; then
            export ATRIO_DELETION_SUPPORT_APPROVED="$ATRIO_PLAY_SUPPORT_REVIEWED"
            export ATRIO_DELETION_SUPPORT_EMAIL="$ATRIO_PLAY_SUPPORT_EMAIL"
            export ATRIO_DELETION_PRIVACY_URL="$ATRIO_PRIVACY_POLICY_URL"
            node cloudflare/account-deletion-support/build.mjs
            test -s cloudflare/account-deletion-support/dist/index.html
            echo 'Página de contato preparada localmente. NÃO foi publicada.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Instalar dependências isoladas do processamento de exclusão
        working-directory: tests/security
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --prefix admin-fixture --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Exigir processamento real apenas no Auth e Firestore Emulator antes de assinar
        working-directory: tests/security
        shell: bash
        env:
          GCLOUD_PROJECT: demo-atrio-v11
        run: |
          set -euo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          test -z "${CLOUDINARY_API_SECRET:-}"
          test -z "${CLOUDINARY_API_KEY:-}"
          test -z "${CLOUDINARY_CLOUD_NAME:-}"
          test -z "${ATRIO_ACCOUNT_DELETION_EXECUTION_ENABLED:-}"
          node prepare.mjs
          npx firebase emulators:exec --only firestore,auth --project demo-atrio-v11 \
            "env -u FIREBASE_CONFIG node --experimental-sqlite admin-fixture/qa-admin-sdk-e2e.test.mjs"
      - name: Declarar limite da homologação de exclusão
        shell: bash
        run: |
          echo "Exclusão Auth/Firestore exercitada somente no projeto demo-atrio-v11, com mídia simulada via HTTP localhost." >> "$GITHUB_STEP_SUMMARY"
          echo "NÃO comprova executor de produção, portal HTTPS, retenção jurídica ou autorização da Play." >> "$GITHUB_STEP_SUMMARY"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar SDK 36 e ferramentas
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Configuração Firebase
        run: python3 scripts/validar_firebase.py
      - name: Assinar AAB com chave existente somente no runner temporário
        shell: bash
        env:
          ATRIO_KEYSTORE_BASE64: ${{ secrets.ATRIO_KEYSTORE_BASE64 }}
          ATRIO_STORE_PASSWORD: ${{ secrets.ATRIO_STORE_PASSWORD }}
          ATRIO_KEY_PASSWORD: ${{ secrets.ATRIO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$ATRIO_KEYSTORE_BASE64" && -n "$ATRIO_STORE_PASSWORD" && -n "$ATRIO_KEY_PASSWORD" ]] || {
            echo "::error::Chave permanente indisponível. Nenhuma chave será recriada."
            exit 1
          }
          umask 077
          KEYSTORE="$RUNNER_TEMP/atrio-play-upload.jks"
          CERT_DER="$RUNNER_TEMP/atrio-play-upload-public.der"
          trap 'rm -f "$KEYSTORE" "$CERT_DER"' EXIT
          printf '%s' "$ATRIO_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          # keytool exports only the public X.509 DER certificate; never print key material.
          keytool -exportcert -keystore "$KEYSTORE" -alias atrio \
            -storepass:env ATRIO_STORE_PASSWORD > "$CERT_DER"
          python3 scripts/play_upload_certificate_check.py --certificate "$CERT_DER"
          export ATRIO_SIGNING_STORE_FILE="$KEYSTORE"
          export ATRIO_SIGNING_STORE_PASSWORD="$ATRIO_STORE_PASSWORD"
          export ATRIO_SIGNING_KEY_ALIAS="atrio"
          export ATRIO_SIGNING_KEY_PASSWORD="$ATRIO_KEY_PASSWORD"
          gradle :app:bundlePlayRelease --no-daemon --stacktrace
          python3 scripts/play_store_bundle_check.py
          AAB=app/build/outputs/bundle/playRelease/app-playRelease.aab
          test -s "$AAB"
          jarsigner -verify "$AAB" >/dev/null || {
            echo "::error::O AAB não passou na verificação de assinatura JAR."
            exit 1
          }
          echo "AAB assinado e verificado. Nenhum upload foi realizado à Google Play." >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$AAB" >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar AAB somente no Actions para revisão humana
        uses: actions/upload-artifact@v4
        with:
          name: atrio-play-aab-assinado-para-revisao
          path: app/build/outputs/bundle/playRelease/app-playRelease.aab
          if-no-files-found: error
          retention-days: 3
