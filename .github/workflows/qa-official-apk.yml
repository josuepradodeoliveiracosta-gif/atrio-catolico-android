name: Conferir integridade do APK oficial

# NEVER add push, pull_request, schedule or workflow_run to this workflow.
on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: 'ID da compilacao aprovada em Gerar APK do Atrio Catolico'
        required: true
        type: string
      apk_sha256:
        description: 'SHA-256 do app-release.apk escolhido (nao do ZIP)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: atrio-official-production-ui
  cancel-in-progress: false

jobs:
  official-ui:
    if: github.repository == 'josuepradodeoliveiracosta-gif/atrio-catolico-android' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APK_RUN_ID: ${{ inputs.apk_run_id }}
      APK_SHA256: ${{ inputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Preparar verificadores do APK
        run: sdkmanager 'build-tools;35.0.0'
      - name: Baixar somente o release assinado existente
        uses: actions/download-artifact@v4
        with:
          name: atrio-catolico-release-assinado
          path: official-apk
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}
      - name: Conferir origem, assinatura, hash e Firebase do APK
        env:
          GH_TOKEN: ${{ github.token }}
          ATRIO_RELEASE_CERT_SHA256: ${{ vars.ATRIO_RELEASE_CERT_SHA256 }}
        run: python3 scripts/qa_official/verify_apk.py
      - name: Guardar apenas evidencias sanitizadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-official-evidence-${{ github.run_id }}
          path: qa-official-results/apk.json
          if-no-files-found: warn
          retention-days: 7
