name: QA Perfil V3 - pergunta e discussão vinculada
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'cloudflare/push-worker/src/index.js'
      - 'cloudflare/push-worker/src/profile-interest-discussion.js'
      - 'tests/security/package*.json'
      - 'tests/security/profile-v3-interests.test.mjs'
      - '.github/workflows/qa-profile-v3-interests.yml'
permissions:
  contents: read
jobs:
  profile-v3-interests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: tests/security
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Identificar o checkout
        run: git rev-parse HEAD HEAD^{tree}
      - run: npm ci --ignore-scripts
      - name: Testar titular e visitante em Auth e Firestore Emulator
        env:
          CI: 'true'
        run: npm run test:profile-v3-interests | tee profile-v3-interests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-profile-v3-interests-${{ github.run_attempt }}
          path: tests/security/profile-v3-interests.log
          if-no-files-found: warn
          retention-days: 7
