name: Validar executor oficial sem acessar producao
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa_official/**'
      - 'tests/qa_official/**'
      - '.github/workflows/qa-official*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests/qa_official -v
      - run: bash -n scripts/qa_official/run-device.sh
