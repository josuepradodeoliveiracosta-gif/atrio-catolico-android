name: Validar executor oficial sem acessar producao
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa_official/**'
      - 'tests/qa_official/**'
      - '.github/workflows/qa-official*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests/qa_official -v
      - run: bash -n scripts/qa_official/run-device.sh
