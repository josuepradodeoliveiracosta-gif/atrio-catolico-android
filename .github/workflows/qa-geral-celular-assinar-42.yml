name: QA Geral Celular — APK 42

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/qa-geral-celular-assinar-42.yml']
  workflow_dispatch:
    inputs:
      source_sha:
        description: SHA completo do candidato 42 auditado
        type: string
        required: true
      deliver_private:
        description: Preservar apenas o APK cifrado para a entrega privada autorizada
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  QA_BASE_SHA: '759b61c126580c628f0dfb74559bcc3bc4e37586'
  QA_BASE_TREE: '23fefdc726b4a1c7412351d916601baae05ffcca'
  QA_SOURCE_SHA: 'f69eed86367ef2775888ac195fa94a1e8a55b9f1'
  QA_SOURCE_TREE: 'e8d2d7d04ff21135f49505627db99da827176178'
  QA_CANDIDATE_PR: '382'
  QA_ROUTE: '.github/workflows/qa-geral-celular-assinar-42.yml'

jobs:
  fixture:
    name: Ensaio isolado do APK 42
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QA_SOURCE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Conferir origem, escopo e recusas de SHA e árvore
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$PR_NUMBER" = "$QA_CANDIDATE_PR"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          printf 'Base: %s / %s\n' "$QA_BASE_SHA" "$QA_BASE_TREE"
          git fetch --no-tags --depth=1 origin "$QA_BASE_SHA"
          test "$(git rev-parse "$QA_BASE_SHA^{tree}")" = "$QA_BASE_TREE"
          printf 'HEAD do workflow: %s / %s\n' "$PR_HEAD" "$(git rev-parse 'HEAD^{tree}')"
          git diff --exit-code "$QA_SOURCE_SHA" "$PR_HEAD" -- . ":(exclude)$QA_ROUTE"
          python3 -m scripts.qa_geral_celular_round42 source candidate "$QA_SOURCE_SHA" "$QA_SOURCE_TREE"
          wrong="$(printf '%040d' 0)"
          for field in sha tree; do
            test_sha="$QA_SOURCE_SHA"
            test_tree="$QA_SOURCE_TREE"
            if [[ "$field" == sha ]]; then test_sha="$wrong"; else test_tree="$wrong"; fi
            if python3 -m scripts.qa_geral_celular_round42 source candidate "$test_sha" "$test_tree"; then
              echo "Referência incorreta foi aceita: $field" >&2
              exit 1
            fi
          done
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Compilar com configuração sintética em área isolada
        run: |
          python3 -m unittest scripts.test_qa_geral_celular_round42 scripts.test_qa_geral_celular_signature -v
          bash scripts/qa_geral_celular_build42.sh candidate "$QA_SOURCE_SHA" "$QA_SOURCE_TREE" \
            "$RUNNER_TEMP/qa42-unsigned.apk" fixture
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QA_SOURCE_SHA }}
          path: qa42-signer
          persist-credentials: false
      - name: Assinar com chave descartável, cifrar e recuperar em checkout limpo
        working-directory: qa42-signer
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          umask 077
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$QA_SOURCE_TREE"
          test -z "$(git status --porcelain --ignored)"
          printf 'Checkout limpo de assinatura: %s / %s / %s\n' "$PWD" "$QA_SOURCE_SHA" "$QA_SOURCE_TREE"
          test -f "$RUNNER_TEMP/qa42-unsigned.apk"
          test ! -L "$RUNNER_TEMP/qa42-unsigned.apk"
          printf 'APK recebido pelo assinador: %s\n' "$(sha256sum < "$RUNNER_TEMP/qa42-unsigned.apk" | cut -d' ' -f1)"
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y age
          fi
          work="$(mktemp -d "$RUNNER_TEMP/qa42-fixture.XXXXXX")"
          trap 'rm -rf -- "$work"; rm -f -- "$RUNNER_TEMP/qa42-unsigned.apk"' EXIT
          export ATRIO_QA_CELULAR_STORE_PASSWORD=fixture-descartavel
          export ATRIO_QA_CELULAR_KEY_PASSWORD="$ATRIO_QA_CELULAR_STORE_PASSWORD"
          export ATRIO_QA_CELULAR_KEY_ALIAS=qa42-fixture
          keytool -genkeypair -keystore "$work/fixture.p12" -storetype PKCS12 \
            -storepass:env ATRIO_QA_CELULAR_STORE_PASSWORD -alias "$ATRIO_QA_CELULAR_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 1 -dname CN=QA42-fixture
          export ATRIO_QA_CELULAR_CERT_SHA256="$(keytool -exportcert -keystore "$work/fixture.p12" \
            -storepass:env ATRIO_QA_CELULAR_STORE_PASSWORD -alias "$ATRIO_QA_CELULAR_KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          export ATRIO_QA_CELULAR_KEYSTORE_BASE64="$(base64 -w0 "$work/fixture.p12")"
          age-keygen -o "$work/identity" 2>/dev/null
          age-keygen -o "$work/other-identity" 2>/dev/null
          export ATRIO_QA_CELULAR_AGE_RECIPIENT="$(age-keygen -y "$work/identity")"
          bash scripts/qa_geral_celular_sign42.sh "$RUNNER_TEMP/qa42-unsigned.apk" "$work/round42.apk.age" | tee "$work/proof"
          unset ATRIO_QA_CELULAR_KEYSTORE_BASE64 ATRIO_QA_CELULAR_KEY_ALIAS
          unset ATRIO_QA_CELULAR_STORE_PASSWORD ATRIO_QA_CELULAR_KEY_PASSWORD

          apk_hash="$(awk '/^SHA-256 do APK assinado:/ {print $NF}' "$work/proof")"
          cipher_hash="$(awk '/^SHA-256 do APK cifrado:/ {print $NF}' "$work/proof")"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          verifier=(python3 -m scripts.qa_geral_celular_round42)
          "${verifier[@]}" recover "$work/round42.apk.age" "$cipher_hash" "$work/identity" \
            "$work/recovered.apk" "$apk_hash" --build-tools "$tools" --certificate "$ATRIO_QA_CELULAR_CERT_SHA256"
          "${verifier[@]}" verify "$work/recovered.apk" "$apk_hash" \
            --build-tools "$tools" --certificate "$ATRIO_QA_CELULAR_CERT_SHA256"

          reject() {
            local label="$1"
            shift
            if "$@"; then
              echo "A entrada divergente foi aceita: $label" >&2
              exit 1
            fi
            printf 'Recusa confirmada: %s\n' "$label"
          }
          wrong="$(printf '%064d' 0)"
          reject "certificado" "${verifier[@]}" verify "$work/recovered.apk" "$apk_hash" \
            --build-tools "$tools" --certificate "$wrong"
          unsigned_hash="$(sha256sum < "$RUNNER_TEMP/qa42-unsigned.apk" | cut -d' ' -f1)"
          reject "APK sem assinatura" "${verifier[@]}" verify "$RUNNER_TEMP/qa42-unsigned.apk" "$unsigned_hash" \
            --build-tools "$tools" --certificate "$ATRIO_QA_CELULAR_CERT_SHA256"
          reject "hash da cifra" "${verifier[@]}" recover "$work/round42.apk.age" "$wrong" "$work/identity" \
            "$work/should-not-exist.apk" "$apk_hash" --build-tools "$tools" --certificate "$ATRIO_QA_CELULAR_CERT_SHA256"
          reject "destinatário" "${verifier[@]}" recover "$work/round42.apk.age" "$cipher_hash" "$work/other-identity" \
            "$work/should-not-exist.apk" "$apk_hash" --build-tools "$tools" --certificate "$ATRIO_QA_CELULAR_CERT_SHA256"
          test ! -e "$work/should-not-exist.apk"
          printf 'alteração de bytes' >> "$work/recovered.apk"
          reject "hash do APK" "${verifier[@]}" verify "$work/recovered.apk" "$apk_hash" \
            --build-tools "$tools" --certificate "$ATRIO_QA_CELULAR_CERT_SHA256"

          {
            printf '## Ensaio do APK 42 (configuração sintética e certificados descartáveis)\n\n'
            printf 'Base %s, árvore %s\n\n' "$QA_BASE_SHA" "$QA_BASE_TREE"
            printf 'Candidato %s, árvore %s\n\n' "$QA_SOURCE_SHA" "$QA_SOURCE_TREE"
            printf 'Workflow da PR %s\n\n' "$GITHUB_RUN_ID"
            cat "$work/proof"
          } >> "$GITHUB_STEP_SUMMARY"

  assinatura:
    name: Assinatura protegida do APK 42
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'josuepradodeoliveiracosta-gif/atrio-catolico-android' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      github.actor == 'josuepradodeoliveiracosta-gif' &&
      github.run_attempt == 1 && inputs.source_sha == 'f69eed86367ef2775888ac195fa94a1e8a55b9f1'
    environment: qa-geral-celular-assinatura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_APK39_CERT_SHA256: 63b26756491bb0103e44e561d63c5481c0d9a6e7374b322ff4e97e1cd5629e57
      QA_FOUNDER_AGE_RECIPIENT: age1aww8m2zr2p85engnrj5yfecpuraveueh6845aepa5jpzywsm2dcszyxmhh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QA_SOURCE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Verificar candidato e vínculo com o workflow da PR
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate rev-parse 'HEAD^0^{tree}')" = "$QA_SOURCE_TREE"
          python3 -m scripts.qa_geral_celular_round42 source candidate "$QA_SOURCE_SHA" "$QA_SOURCE_TREE"
          git fetch --no-tags --depth=1 origin "$QA_SOURCE_SHA"
          git fetch --no-tags --depth=1 origin "refs/pull/$QA_CANDIDATE_PR/head"
          audited_head="$(git rev-parse FETCH_HEAD)"
          git diff --exit-code "$QA_SOURCE_SHA" "$audited_head" -- . ":(exclude)$QA_ROUTE"
          git diff --exit-code "$audited_head" "$GITHUB_SHA" -- "$QA_ROUTE"
          printf 'QA_AUDITED_HEAD=%s\n' "$audited_head" >> "$GITHUB_ENV"
          {
            printf '## Origem do APK QA Geral Celular 42\n\n'
            printf 'Base %s, árvore %s\n\n' "$QA_BASE_SHA" "$QA_BASE_TREE"
            printf 'Candidato %s, árvore %s\n\n' "$QA_SOURCE_SHA" "$QA_SOURCE_TREE"
            printf 'PR #%s, HEAD %s\n\n' "$QA_CANDIDATE_PR" "$audited_head"
            printf 'Workflow protegido %s, árvore %s\n\n' "$GITHUB_SHA" "$(git rev-parse 'HEAD^{tree}')"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Conferir destinatário da entrega autorizada
        if: inputs.deliver_private
        env:
          ATRIO_QA_CELULAR_AGE_RECIPIENT: ${{ vars.ATRIO_QA_CELULAR_AGE_RECIPIENT }}
        run: |
          test "$ATRIO_QA_CELULAR_AGE_RECIPIENT" = "$QA_FOUNDER_AGE_RECIPIENT"
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y age
          fi
          mkdir -m 700 "$RUNNER_TEMP/qa42-delivery"
      - name: Compilar com a configuração registrada em área isolada
        env:
          ATRIO_QA_CELULAR_GOOGLE_SERVICES_JSON: ${{ secrets.ATRIO_QA_CELULAR_GOOGLE_SERVICES_JSON }}
        run: |
          bash scripts/qa_geral_celular_build42.sh candidate "$QA_SOURCE_SHA" "$QA_SOURCE_TREE" \
            "$RUNNER_TEMP/qa42-unsigned.apk" registered
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QA_SOURCE_SHA }}
          path: qa42-signer
          persist-credentials: false
      - name: Reconfirmar a referência antes de disponibilizar o keystore
        run: |
          test "$(git ls-remote --exit-code origin "refs/pull/$QA_CANDIDATE_PR/head" | cut -f1)" = "$QA_AUDITED_HEAD"
          cd qa42-signer
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$QA_SOURCE_TREE"
          test -z "$(git status --porcelain --ignored)"
          printf 'Checkout limpo de assinatura: %s / %s / %s\n' "$PWD" "$QA_SOURCE_SHA" "$QA_SOURCE_TREE"
          test -f "$RUNNER_TEMP/qa42-unsigned.apk"
          test ! -L "$RUNNER_TEMP/qa42-unsigned.apk"
          printf 'APK recebido pelo assinador: %s\n' "$(sha256sum < "$RUNNER_TEMP/qa42-unsigned.apk" | cut -d' ' -f1)"
      - name: Assinar e registrar a identidade a partir do checkout limpo
        working-directory: qa42-signer
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          QA_DELIVER_PRIVATE: ${{ inputs.deliver_private }}
          ATRIO_QA_CELULAR_AGE_RECIPIENT: ${{ vars.ATRIO_QA_CELULAR_AGE_RECIPIENT }}
          ATRIO_QA_CELULAR_CERT_SHA256: ${{ vars.ATRIO_QA_CELULAR_CERT_SHA256 }}
          ATRIO_QA_CELULAR_KEYSTORE_BASE64: ${{ secrets.ATRIO_QA_CELULAR_KEYSTORE_BASE64 }}
          ATRIO_QA_CELULAR_KEY_ALIAS: ${{ secrets.ATRIO_QA_CELULAR_KEY_ALIAS }}
          ATRIO_QA_CELULAR_STORE_PASSWORD: ${{ secrets.ATRIO_QA_CELULAR_STORE_PASSWORD }}
          ATRIO_QA_CELULAR_KEY_PASSWORD: ${{ secrets.ATRIO_QA_CELULAR_KEY_PASSWORD }}
        run: |
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$QA_SOURCE_TREE"
          test -z "$(git status --porcelain --ignored)"
          test "${ATRIO_QA_CELULAR_CERT_SHA256,,}" = "$QA_APK39_CERT_SHA256"
          output=()
          if [[ "$QA_DELIVER_PRIVATE" == true ]]; then
            test "$ATRIO_QA_CELULAR_AGE_RECIPIENT" = "$QA_FOUNDER_AGE_RECIPIENT"
            output=("$RUNNER_TEMP/qa42-delivery/atrio-qa-geral-celular-42.apk.age")
          fi
          bash scripts/qa_geral_celular_sign42.sh "$RUNNER_TEMP/qa42-unsigned.apk" "${output[@]}" |
            tee -a "$GITHUB_STEP_SUMMARY"
      - name: Disponibilizar apenas o APK cifrado
        if: inputs.deliver_private
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atrio-qa-geral-celular-42-cifrado
          path: ${{ runner.temp }}/qa42-delivery/atrio-qa-geral-celular-42.apk.age
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Limpar o staging do runner
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/qa42-unsigned.apk"
          rm -rf -- "$RUNNER_TEMP/qa42-delivery"
