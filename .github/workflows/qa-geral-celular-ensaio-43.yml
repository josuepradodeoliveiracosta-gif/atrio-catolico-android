name: QA Geral Celular — ensaio do APK 43

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/qa-geral-celular-ensaio-43.yml']

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  QA_BASE_SHA: '71ba0d669795a7705126a2484714564ef2144a7e'
  QA_BASE_TREE: 'cc6c3046ca2595f3bec714b4515da2d69f9a235b'
  QA_SOURCE_SHA: '118b34e4474a60ddc16a6e9435d7b8e9e418cad3'
  QA_SOURCE_TREE: '4d43730a27220173a84a887cf29462a3745f19ee'
  QA_BUILD_MODE: 'fixture43'
  QA_COMBINED_SHA: ''
  QA_COMBINED_TREE: ''
  QA_ROUTE: '.github/workflows/qa-geral-celular-ensaio-43.yml'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  fixture:
    name: Ensaiar build isolado e assinatura descartável do APK 43
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/chat5-199-ensaio-apk-43'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QA_SOURCE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Conferir os SHAs e as árvores da composição
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$PR_BASE" = "$QA_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          git fetch --no-tags --depth=1 origin "$QA_BASE_SHA"
          test "$(git rev-parse "$QA_BASE_SHA^{tree}")" = "$QA_BASE_TREE"
          printf 'Base %s / %s\n' "$QA_BASE_SHA" "$QA_BASE_TREE"
          printf 'HEAD do workflow %s / %s\n' "$PR_HEAD" "$(git rev-parse 'HEAD^{tree}')"
          git diff --exit-code "$QA_SOURCE_SHA" "$PR_HEAD" -- . ":(exclude)$QA_ROUTE"
          case "$QA_BUILD_MODE" in
            fixture43)
              test -z "$QA_COMBINED_SHA" && test -z "$QA_COMBINED_TREE"
              ;;
            notice43)
              [[ "$QA_COMBINED_SHA" =~ ^[0-9a-f]{40}$ && "$QA_COMBINED_TREE" =~ ^[0-9a-f]{40}$ ]]
              git fetch --no-tags --depth=1 origin "$QA_COMBINED_SHA"
              test "$(git rev-parse "$QA_COMBINED_SHA^{tree}")" = "$QA_COMBINED_TREE"
              printf 'Composição do Chat 6: %s / %s\n' "$QA_COMBINED_SHA" "$QA_COMBINED_TREE"
              git diff --exit-code "$QA_COMBINED_SHA" "$QA_SOURCE_SHA" -- . \
                ':(exclude)app/build.gradle.kts' \
                ':(exclude)scripts/qa_geral_celular_build42.sh' \
                ':(exclude)scripts/qa_geral_celular_manual.sh' \
                ':(exclude)scripts/qa_geral_celular_round42.py' \
                ':(exclude)scripts/qa_geral_celular_round43.py' \
                ':(exclude)scripts/test_qa_geral_celular_round43.py' \
                ":(exclude)$QA_ROUTE"
              ;;
            *) exit 2 ;;
          esac
          python3 -m scripts.qa_geral_celular_round42 source candidate "$QA_SOURCE_SHA" "$QA_SOURCE_TREE"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Testar os controles de transferência, metadados e assinatura
        run: python3 -m unittest scripts.test_qa_geral_celular_round42 scripts.test_qa_geral_celular_round43 scripts.test_qa_geral_celular_signature -v
      - name: Compilar com configuração fictícia em conta descartável
        id: build
        run: |
          bash scripts/qa_geral_celular_build42.sh candidate "$QA_SOURCE_SHA" "$QA_SOURCE_TREE" \
            "$RUNNER_TEMP/qa43-unsigned.apk" "$QA_BUILD_MODE"
          printf 'sha256=%s\n' "$(sha256sum < "$RUNNER_TEMP/qa43-unsigned.apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QA_SOURCE_SHA }}
          path: qa43-signer
          persist-credentials: false
      - name: Conferir, assinar, cifrar e recuperar em checkout separado
        working-directory: qa43-signer
        env:
          BUILD_APK_SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          umask 077
          test -z "$(git status --porcelain --ignored)"
          python3 -m scripts.qa_geral_celular_round42 source . "$QA_SOURCE_SHA" "$QA_SOURCE_TREE"
          printf 'Checkout limpo de assinatura: %s\n' "$PWD"
          unsigned="$RUNNER_TEMP/qa43-unsigned.apk"
          test -s "$unsigned"
          test ! -L "$unsigned"
          received_hash="$(sha256sum < "$unsigned" | cut -d' ' -f1)"
          test -n "$BUILD_APK_SHA256"
          test "$received_hash" = "$BUILD_APK_SHA256"
          printf 'APK sem assinatura recebido: %s\n' "$received_hash"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          verifier=(python3 -m scripts.qa_geral_celular_round43)
          metadata_args=(--build-tools "$tools")
          if [[ "$QA_BUILD_MODE" == notice43 ]]; then
            metadata_args+=(--notice-lab)
          fi
          "${verifier[@]}" metadata "$unsigned" "${metadata_args[@]}"
          if "$tools/apksigner" verify "$unsigned"; then
            echo 'O APK recebido já tem assinatura.' >&2
            exit 1
          fi
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y age
          fi
          work="$(mktemp -d "$RUNNER_TEMP/qa43-fixture.XXXXXX")"
          trap 'rm -rf -- "$work"; rm -f -- "$unsigned"' EXIT
          export ATRIO_QA_CELULAR_STORE_PASSWORD=fixture-descartavel
          export ATRIO_QA_CELULAR_KEY_PASSWORD="$ATRIO_QA_CELULAR_STORE_PASSWORD"
          export ATRIO_QA_CELULAR_KEY_ALIAS=qa43-fixture
          keytool -genkeypair -keystore "$work/fixture.p12" -storetype PKCS12 \
            -storepass:env ATRIO_QA_CELULAR_STORE_PASSWORD -alias "$ATRIO_QA_CELULAR_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 1 -dname CN=QA43-fixture
          cert_hash="$(keytool -exportcert -keystore "$work/fixture.p12" \
            -storepass:env ATRIO_QA_CELULAR_STORE_PASSWORD -alias "$ATRIO_QA_CELULAR_KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          bash scripts/qa_geral_celular_manual.sh sign "$unsigned" "$work/signed.apk" "$work/fixture.p12"
          rm -- "$work/fixture.p12"
          unset ATRIO_QA_CELULAR_STORE_PASSWORD ATRIO_QA_CELULAR_KEY_PASSWORD ATRIO_QA_CELULAR_KEY_ALIAS
          apk_hash="$(sha256sum < "$work/signed.apk" | cut -d' ' -f1)"
          age-keygen -o "$work/identity" 2>/dev/null
          age --encrypt --recipient "$(age-keygen -y "$work/identity")" --output "$work/signed.apk.age" "$work/signed.apk"
          age --decrypt --identity "$work/identity" --output "$work/recovered.apk" "$work/signed.apk.age"
          proof=("${verifier[@]}" proof .)
          "${proof[@]}" "$QA_SOURCE_SHA" "$QA_SOURCE_TREE" "$apk_hash" "$cert_hash" \
            "$work/recovered.apk" "${metadata_args[@]}" | tee "$work/proof"
          reject() {
            local label="$1"
            shift
            if "$@"; then
              echo "A entrada divergente foi aceita: $label" >&2
              exit 1
            fi
            printf 'Recusa confirmada: %s\n' "$label"
          }
          wrong_git="$(printf '%040d' 0)"
          wrong_digest="$(printf '%064d' 0)"
          reject "SHA Git" "${proof[@]}" "$wrong_git" "$QA_SOURCE_TREE" "$apk_hash" "$cert_hash" \
            "$work/recovered.apk" "${metadata_args[@]}"
          reject "árvore Git" "${proof[@]}" "$QA_SOURCE_SHA" "$wrong_git" "$apk_hash" "$cert_hash" \
            "$work/recovered.apk" "${metadata_args[@]}"
          reject "certificado" "${proof[@]}" "$QA_SOURCE_SHA" "$QA_SOURCE_TREE" "$apk_hash" "$wrong_digest" \
            "$work/recovered.apk" "${metadata_args[@]}"
          reject "APK sem assinatura" "${proof[@]}" "$QA_SOURCE_SHA" "$QA_SOURCE_TREE" "$received_hash" "$cert_hash" \
            "$unsigned" "${metadata_args[@]}"
          printf 'alteração de bytes' >> "$work/recovered.apk"
          reject "hash do APK" "${proof[@]}" "$QA_SOURCE_SHA" "$QA_SOURCE_TREE" "$apk_hash" "$cert_hash" \
            "$work/recovered.apk" "${metadata_args[@]}"
          {
            printf '## APK 43 — ensaio com configuração e chave fictícias\n\n'
            printf 'APK sem assinatura recebido: `%s`\n\n' "$received_hash"
            if [[ "$QA_BUILD_MODE" == notice43 ]]; then
              printf 'Composição do Chat 6: `%s` / `%s`\n\n' "$QA_COMBINED_SHA" "$QA_COMBINED_TREE"
            fi
            printf '```json\n'
            tail -n 1 "$work/proof"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
