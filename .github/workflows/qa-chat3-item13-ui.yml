name: Chat 3 — Interface de moderação por caso (QA isolado)

on:
  pull_request:
    branches: [qa/chat5-199-item13-android-445]
    paths:
      - '.github/workflows/qa-chat3-item13-ui.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/br/com/atriocatolico/ScopedConversationModeration.kt'
      - 'app/src/main/java/br/com/atriocatolico/ModerationScreen.kt'
      - 'app/src/androidTest/java/br/com/atriocatolico/ScopedConversationModerationEmulatorUiTest.kt'
      - 'scripts/run-qa-android-emulator.sh'

permissions:
  contents: read

concurrency:
  group: qa-chat3-item13-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-item13-ui:
    name: 'Atendimento por caso — UI, erro e revogação'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATRIO_QA_GERAL_BUILD: '1'
      ATRIO_QA_GERAL_CELULAR_PILOT: '1'
      ATRIO_QA_APK: qaGeral
      ATRIO_QA_FIREBASE_PROJECT: demo-atrio-v11
      ATRIO_QA_SUITE: ScopedConversationModerationEmulatorUiTest
      SOURCE_SHA: 6a45638126b6b75669045a1d9e90786b138d5659
      SOURCE_TREE: 167b41240f4a0ea476e3b16d448d8a3713831850
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Garantir delta limitado à UI e QA sobre a #447
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree}
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          git diff --check "$SOURCE_SHA" HEAD
          actual="$(git diff --name-only "$SOURCE_SHA" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/workflows/qa-chat3-item13-ui.yml' 'app/build.gradle.kts' 'app/src/androidTest/java/br/com/atriocatolico/ScopedConversationModerationEmulatorUiTest.kt' 'app/src/main/java/br/com/atriocatolico/ScopedConversationModeration.kt' 'app/src/main/java/br/com/atriocatolico/ModerationScreen.kt' 'scripts/run-qa-android-emulator.sh' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${ATRIO_PUSH_WORKER_URL:-}"
          test -z "${ATRIO_QA_MODERATION_CASE_ORIGIN:-}"
          test -z "${ATRIO_QA_MODERATION_CASE_LAB:-}"
          echo "Item 13: backend/Rules #445 e QA independente #447 preservados."
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
      - name: Compilar variante QA isolada antes do boot
        shell: bash
        run: |
          rm -f -- app/google-services.json
          bash scripts/qa-android-prebuild.sh start
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/security/package-lock.json
      - name: Dependencias fixadas do Firebase Emulator
        run: npm ci --prefix tests/security
      - name: Preparar KVM em VM efemera
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Testar UI de caso, revogação fictícia, troca de conta e falhas no emulador
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disk-size: 2048M
          ram-size: 2048M
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel on -camera-back none
          script: bash scripts/run-qa-android-emulator.sh
      - name: Compilar e verificar testes JVM do QA Geral
        run: gradle :app:testQaGeralUnitTest
      - name: Verificar pacote e SHA-256 do APK QA, sem assinatura permanente
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/qaGeral/app-qaGeral.apk'
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n1)"
          test "$("$aapt" dump packagename "$apk")" = br.com.atriocatolico.qageral.celular
          sha256sum "$apk"
      - name: Preservar XML, Logcat e logs do Firebase Emulator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-chat3-item13-ui-${{ github.event.pull_request.head.sha }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            qa-android-suite-results
            qa-firebase-emulators.log
            qa-android-prebuild.log
          retention-days: 7
          if-no-files-found: warn
