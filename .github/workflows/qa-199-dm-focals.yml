name: Focais de recusa e desbloqueio DM da Issue 199

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/qa-199-dm-focals.yml']

permissions:
  contents: read

concurrency:
  group: qa-issue199-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ github.head_ref == 'qa/chat5-199-dm-recusa-desbloqueio' }}
    name: DM — ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [RECUSA]
    env:
      TECH_REF: ${{ github.event.pull_request.head.sha }}
      ATRIO_QA_GERAL_BUILD: '1'
      ATRIO_QA_GERAL_CELULAR_PILOT: '0'
      ATRIO_QA_INBOX_DISCOVERY: '0'
      ATRIO_QA_APK: qaGeral
      ATRIO_QA_FIREBASE_PROJECT: demo-atrio-v11
      ATRIO_QA_199_CASE: ${{ matrix.mode }}
      ATRIO_QA_SUITE: 'AtrioConversasCompostasEmulatorUiTest#primeiroContatoRecusaAceiteESaidaProtegemHistorico'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Conferir dependências da instrumentação no Maven Central
        run: |
          for pom in \
            junit/junit/4.13.2/junit-4.13.2.pom \
            org/jetbrains/kotlinx/kotlinx-coroutines-test/1.10.2/kotlinx-coroutines-test-1.10.2.pom \
            com/squareup/javawriter/2.1.1/javawriter-2.1.1.pom \
            org/hamcrest/hamcrest-library/1.3/hamcrest-library-1.3.pom \
            org/hamcrest/hamcrest-integration/1.3/hamcrest-integration-1.3.pom; do
            curl -fsS --retry 3 --retry-delay 3 --retry-all-errors --max-time 15 \
              "https://repo.maven.apache.org/maven2/$pom" -o /dev/null
          done
      - name: Compilar a variante local sem configuração Firebase remota
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          test "$(git rev-parse HEAD)" = "$TECH_REF"
          rm -f -- app/google-services.json
          bash scripts/qa-android-prebuild.sh start
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/security/package-lock.json
      - name: Preparar Firebase Emulator
        run: npm ci --prefix tests/security
      - name: Habilitar Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Validar a suíte focal com contas fictícias
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disk-size: 2048M
          ram-size: 2048M
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel on -camera-back none
          script: bash scripts/run-qa-android-emulator.sh
      - name: Registrar o pacote e o SHA-256 do APK instrumentado
        run: |
          apk='app/build/outputs/apk/qaGeral/app-qaGeral.apk'
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n1)"
          "$aapt" dump badging "$apk" | awk '/^package: / { print }'
          test "$("$aapt" dump packagename "$apk")" = 'br.com.atriocatolico.qageral'
          sha256sum "$apk"
      - name: Exibir marcadores de diagnóstico
        if: always()
        run: |
          if [[ -d qa-android-suite-results ]]; then
            find qa-android-suite-results -name 'logcat-*.txt' -exec grep -h 'AtrioDmQA:' {} + || true
          fi
      - name: Preservar evidências da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dm-199-${{ matrix.mode }}-attempt-${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            qa-android-suite-results
            qa-firebase-emulators.log
            qa-android-prebuild.log
          retention-days: 7
          if-no-files-found: warn
