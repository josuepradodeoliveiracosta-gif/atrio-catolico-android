name: Regras do QA Geral Celular no Firestore Emulator
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/qa-geral-celular-firestore.yml
      - firebase/qa-geral-celular/**
      - tests/security/qa-geral-celular.test.mjs
      - tests/security/qa-geral-celular-pilot.test.mjs
permissions:
  contents: read
jobs:
  regras:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Verificar regras com contas fictícias no emulador
        working-directory: tests/security
        shell: bash
        run: |
          npm ci
          node prepare.mjs
          ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-atrio-v11 'node --test --test-concurrency=1 qa-geral-celular.test.mjs qa-geral-celular-pilot.test.mjs'
