name: Átrio Conversas — preflight offline da identidade do APK QA

# Testes sintéticos e compilação local de APK não distribuído com Firebase fictício.
# Não instala, publica, usa credenciais reais ou acessa Firebase/Cloudflare.
on:
  pull_request:
    branches: [main, feat/atrio-conversas-etapa1-20261106]
    paths:
      - 'scripts/chat_qa_apk_identity.py'
      - 'scripts/test_chat_qa_apk_identity.py'
      - 'scripts/chat_qa_build_gate.py'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/br/com/atriocatolico/OnlineAtrioApp.kt'
      - 'app/src/main/java/br/com/atriocatolico/RegistrationV2.kt'
      - 'app/src/main/java/br/com/atriocatolico/UnifiedExceptionalReportQa.kt'
      - 'app/src/test/java/br/com/atriocatolico/UnifiedReportEntryQaPolicyTest.kt'
      - 'app/src/main/java/br/com/atriocatolico/ChatAgeRegistrationPrecheck.kt'
      - 'app/src/main/java/br/com/atriocatolico/ChatQaDeclarationRecovery.kt'
      - 'app/src/main/java/br/com/atriocatolico/QaCommunityPolicyAccess.kt'
      - 'app/src/test/java/br/com/atriocatolico/QaCommunityPolicyAccessTest.kt'
      - 'app/src/main/java/br/com/atriocatolico/AtrioConversations.kt'
      - 'app/src/main/java/br/com/atriocatolico/AtrioGroups.kt'
      - 'app/src/main/java/br/com/atriocatolico/PublicMemberProfile.kt'
      - 'app/src/main/java/br/com/atriocatolico/UserReportsAdminPanel.kt'
      - 'app/src/main/java/br/com/atriocatolico/UserReportsReviewPolicy.kt'
      - 'app/src/test/java/br/com/atriocatolico/UserReportsReviewPolicyTest.kt'
      - 'app/src/main/java/br/com/atriocatolico/ChatReportReceiptPolicy.kt'
      - 'app/src/test/java/br/com/atriocatolico/ChatReportReceiptPolicyTest.kt'
      - 'app/src/test/java/br/com/atriocatolico/ChatQaDeclarationPolicyTest.kt'
      - 'app/src/test/java/br/com/atriocatolico/ChatAgeRegistrationPrecheckTest.kt'
      - 'app/src/chatQa/AndroidManifest.xml'
      - 'scripts/test_chat_qa_build_gate.py'
      - '.github/workflows/chat-qa-apk-identity.yml'
      - 'firebase/qa-general/self-declaration-candidate.mjs'
      - 'docs/qa-homologacao/CHAT-AUTODECLARACAO-18-QA.md'

permissions:
  contents: read

# Preservar cada execucao de teste por SHA, sem interrupcao automatica.
# Testes de PR por run_id: nao cancelar evidencias de outros SHAs.
concurrency:
  group: atrio-chatqa-identity-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  unit-qa-apk-identity:
    name: Verificar identidade de APK QA com fixtures sintéticas
    if: >-
      (github.event.pull_request.number == 193 || github.event.pull_request.number == 232) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter código da PR sem manter credenciais
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verificar sintaxe Python
        run: python3 -m py_compile scripts/chat_qa_apk_identity.py scripts/test_chat_qa_apk_identity.py scripts/chat_qa_build_gate.py scripts/test_chat_qa_build_gate.py
      - name: Executar casos positivos e negativos sem APK nem rede
        run: python3 -m unittest scripts.test_chat_qa_apk_identity scripts.test_chat_qa_build_gate -v

  build-synthetic-chat-qa:
    name: Compilar Chat QA somente com Firebase fictício
    if: >-
      (github.event.pull_request.number == 193 || github.event.pull_request.number == 232) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ATRIO_CHAT_QA_BUILD: '1'
      ATRIO_CHAT_QA_PROJECT: atrio-catolico-qa-geral
      ATRIO_CHAT_QA_APP_ID: '1:123456789:android:abc12345'
      ATRIO_CHAT_QA_OFFLINE_ONLY: '1'
      ATRIO_CHAT_QA_WORKER_URL: ''
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar Android 36 e build-tools 35
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Criar configuração sintética sem Firebase real
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path("app/src/chatQa/google-services.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          config = {
              "project_info": {
                  "project_id": "atrio-catolico-qa-geral",
                  "project_number": "123456789"
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:123456789:android:abc12345",
                      "android_client_info": {
                          "package_name": "br.com.atriocatolico.chatqa"
                      }
                  },
                  "api_key": [{"current_key": "synthetic-not-a-google-key"}]
              }],
              "configuration_version": "1"
          }
          path.write_text(json.dumps(config, sort_keys=True), encoding="utf-8")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("ATRIO_CHAT_QA_CONFIG_SHA256=" + digest + "\n")
          print("JSON fictício de QA criado sem credenciais oficiais.")
          PY
      - name: Compilar SOMENTE a variante Chat QA no runner
        run: gradle :app:assembleChatQa --no-daemon --stacktrace
      - name: Auditar pacote e recursos Firebase gerados
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, os, subprocess
          from pathlib import Path
          from scripts.chat_qa_apk_identity import reject_embedded_production_workers
          apks = list(Path("app/build/outputs/apk/chatQa").glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit("Falha fechada: APK Chat QA único não localizado.")
          apk = apks[0]
          sdk = Path(os.environ["ANDROID_HOME"])
          aapt = sdk / "build-tools" / "35.0.0" / "aapt"
          output = subprocess.check_output([str(aapt), "dump", "badging", str(apk)], text=True)
          if not re.search(r"package: name='br\.com\.atriocatolico\.chatqa'", output):
              raise SystemExit("Falha: pacote distinto Chat QA não encontrado.")
          # Auditar o APK efetivo, sem depender da pasta privada de saída do plugin.
          # AAPT confirma os nomes dos recursos; resources.arsc contém os valores
          # no pacote Android, em UTF-8 ou UTF-16 conforme a tabela compilada.
          import zipfile
          with zipfile.ZipFile(apk) as archive:
              table = archive.read("resources.arsc")
              dex_names = [name for name in archive.namelist()
                           if re.fullmatch(r"classes[0-9]*\.dex", name)]
              dex_contents = [archive.read(name) for name in dex_names]
          if not dex_contents:
              raise SystemExit("Falha: APK QA não contém bytecode Android.")
          # A mesma defesa testada nas fixtures agora valida o APK compilado.
          # Inclui nomes de hosts em DEX e resources.arsc, mesmo sem https://.
          reject_embedded_production_workers(apk)
          if os.environ.get("ATRIO_CHAT_QA_OFFLINE_ONLY") != "1" or os.environ.get("ATRIO_CHAT_QA_WORKER_URL"):
              raise SystemExit("Falha: runner nao esta offline.")
          if any(b"https://atrio-qa-geral." in dex for dex in dex_contents):
              raise SystemExit("Falha: APK offline aponta para Worker publico.")
          resource_dump = subprocess.check_output(
              [str(aapt), "dump", "--values", "resources", str(apk)], text=True
          )
          expected = {
              "project_id": "atrio-catolico-qa-geral",
              "google_app_id": "1:123456789:android:abc12345",
              "gcm_defaultSenderId": "123456789",
          }
          for key, value in expected.items():
              if not re.search(r"\bstring/" + re.escape(key) + r"\b", resource_dump):
                  raise SystemExit("Falha: recurso Firebase de QA não está no APK.")
              if value.encode("utf-8") not in table and value.encode("utf-16le") not in table:
                  raise SystemExit("Falha: valor Firebase QA não está na tabela do APK.")
          signer = sdk / "build-tools" / "35.0.0" / "apksigner"
          check = subprocess.check_output(
              [str(signer), "verify", "--print-certs", str(apk)], text=True
          )
          prod_cert = "ba2e86eacf32e2785718040d704609d3c95c3b88363c08dd3d7c5abe299902b0"
          matches = re.findall(r"Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F:]+)", check)
          if len(matches) != 1 or matches[0].replace(":", "").lower() == prod_cert:
              raise SystemExit("Falha: APK sem signer QA único ou assinado como Release oficial.")
          print("OK: APK QA sintético com identidade de QA, assinatura Debug e sem os Workers oficiais conhecidos.")
          print("Não demonstra isolamento em execução nem entrega FCM; nenhum APK foi distribuído.")
          PY
      - name: Executar JUnit de políticas QA e comprovantes de denúncias sem credenciais
        # O build ChatQa só permite assembleChatQa por segurança.
        # Reconfigurar estas variáveis APENAS neste passo para executar
        # um teste JVM local da política, nunca para implantar serviços.
        shell: bash
        env:
          ATRIO_CHAT_QA_BUILD: ''
          ATRIO_CHAT_QA_PROJECT: ''
          ATRIO_CHAT_QA_APP_ID: ''
          ATRIO_CHAT_QA_OFFLINE_ONLY: ''
          ATRIO_CHAT_QA_WORKER_URL: ''
        run: |
          set -euo pipefail
          # O checkout do repositório pode conter app/google-services.json.
          # Apagar SÓ A CÓPIA EFÊMERA no runner, como na CI Android de QA;
          # nunca editar o arquivo rastreado no GitHub ou usar serviço real.
          test "${GITHUB_ACTIONS:-}" = "true"
          if [[ -e app/google-services.json ]]; then
            rm -- app/google-services.json
          fi
          test ! -e app/google-services.json
          for key in ATRIO_CHAT_QA_BUILD ATRIO_CHAT_QA_PROJECT ATRIO_CHAT_QA_APP_ID ATRIO_CHAT_QA_OFFLINE_ONLY ATRIO_CHAT_QA_WORKER_URL ATRIO_PUSH_WORKER_URL ATRIO_AVATAR_WORKER_URL ATRIO_GUARDIAN_V2_WORKER_URL ATRIO_SIGNING_STORE_FILE ATRIO_SIGNING_STORE_PASSWORD ATRIO_SIGNING_KEY_ALIAS ATRIO_SIGNING_KEY_PASSWORD GOOGLE_APPLICATION_CREDENTIALS; do
            if [[ -n "${!key:-}" ]]; then
              echo "Precheck JUnit exige ambiente sem credenciais/Workers: $key" >&2
              exit 2
            fi
          done
          gradle :app:testDebugUnitTest \
            --tests br.com.atriocatolico.ChatAgeRegistrationPrecheckTest \
            --tests br.com.atriocatolico.ChatQaDeclarationPolicyTest \
            --tests br.com.atriocatolico.ChatReportReceiptPolicyTest \
            --tests br.com.atriocatolico.ParticipantReportReceiptPolicyTest \
            --tests br.com.atriocatolico.UserReportsReviewPolicyTest \
            --tests br.com.atriocatolico.UnifiedReportEntryQaPolicyTest \
            --no-daemon --stacktrace
      - name: Apagar configuração sintética do runner
        if: always()
        run: rm -f app/src/chatQa/google-services.json
