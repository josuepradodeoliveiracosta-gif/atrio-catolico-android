name: OTA — proteger assinatura e publicacao ate homologacao real

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/ota-publish-release.yml'
      - '.github/workflows/ota-release-gate-ci.yml'
      - 'scripts/test_ota_release_gate.py'
      - 'scripts/test_ota_release_readiness.py'
      - 'scripts/test_release_human_moderation.py'
      - 'scripts/test_ota_official_entrypoints.py'
      - 'scripts/ota_official_https_probe.py'
      - 'scripts/test_ota_official_https_probe.py'
      - '.github/workflows/ota-official-https-readonly.yml'
      - 'scripts/test_ota_release_cert.py'
      - 'scripts/ota_release_cert.py'
      - 'scripts/ota_baseline_0200.py'
      - 'scripts/test_ota_baseline_0200.py'
      - 'scripts/ota_release_pair_preflight.py'
      - 'scripts/test_ota_release_pair_preflight.py'
      - 'scripts/ota_release_pilot_server.py'
      - 'scripts/test_ota_release_pilot_server.py'
      - '.github/workflows/ota-pilot-signed-encrypted.yml'
      - 'scripts/test_ota_pilot_signed_workflow.py'
      - 'app/src/otaPilot/**'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/br/com/atriocatolico/Ota*.kt'
      - '.github/workflows/ota-release-pair-preflight.yml'
      - 'scripts/ota_release.py'
      - 'scripts/ota_apk_preflight.py'
      - 'docs/qa-homologacao/OTA_RELEASE_GATE.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/ota-publish-release.yml'
      - '.github/workflows/ota-release-gate-ci.yml'
      - 'scripts/test_ota_release_gate.py'
      - 'scripts/test_ota_release_readiness.py'
      - 'scripts/test_release_human_moderation.py'
      - 'scripts/test_ota_official_entrypoints.py'
      - 'scripts/ota_official_https_probe.py'
      - 'scripts/test_ota_official_https_probe.py'
      - '.github/workflows/ota-official-https-readonly.yml'
      - 'scripts/test_ota_release_cert.py'
      - 'scripts/ota_release_cert.py'
      - 'scripts/ota_baseline_0200.py'
      - 'scripts/test_ota_baseline_0200.py'
      - 'scripts/ota_release_pair_preflight.py'
      - 'scripts/test_ota_release_pair_preflight.py'
      - 'scripts/ota_release_pilot_server.py'
      - 'scripts/test_ota_release_pilot_server.py'
      - '.github/workflows/ota-pilot-signed-encrypted.yml'
      - 'scripts/test_ota_pilot_signed_workflow.py'
      - 'app/src/otaPilot/**'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/br/com/atriocatolico/Ota*.kt'
      - '.github/workflows/ota-release-pair-preflight.yml'
      - 'scripts/ota_release.py'
      - 'scripts/ota_apk_preflight.py'
      - 'docs/qa-homologacao/OTA_RELEASE_GATE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-gates:
    name: Verificar release OTA bloqueado por padrao
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Obter codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rodar regressao das travas sem segredos
        run: |
          python3 -m unittest discover -s scripts -p 'test_ota_release_gate.py' -v
          python3 -m unittest discover -s scripts -p 'test_ota_release_readiness.py' -v
          python3 -m unittest discover -s scripts -p 'test_release_human_moderation.py' -v
          python3 -m unittest discover -s scripts -p 'test_ota_official_entrypoints.py' -v
          python3 -m unittest discover -s scripts -p 'test_ota_official_https_probe.py' -v
          python3 -m unittest discover -s scripts -p 'test_ota_release_cert.py' -v
          python3 -m unittest discover -s scripts -p 'test_ota_baseline_0200.py' -v
          python3 -m unittest discover -s scripts -p 'test_ota_release_pair_preflight.py' -v
          python3 -m unittest discover -s scripts -p 'test_ota_release_pilot_server.py' -v
          python3 -m py_compile scripts/ota_release_pilot_server.py
          python3 -m unittest discover -s scripts -p 'test_ota_pilot_signed_workflow.py' -v
