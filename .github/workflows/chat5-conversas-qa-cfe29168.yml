name: Conversas QA - Firestore no SHA da PR 320
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/chat5-conversas-qa-cfe29168.yml']
permissions:
  contents: read
jobs:
  firestore:
    if: github.head_ref == 'test/chat5-320-conversas-qa-cfe29168' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tests/security
    steps:
      - name: Obter o SHA solicitado
        uses: actions/checkout@v7
        with:
          ref: 'cfe29168b21de539e42931976b13b392546ad94d'
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v7
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirmar checkout e isolamento
        run: |
          git log -1 --format=%H
          test "$(git rev-parse HEAD)" = 'cfe29168b21de539e42931976b13b392546ad94d'
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
      - name: Instalar dependências travadas
        run: npm ci
      - name: Testar Conversas, Grupos e paridade no Firestore Emulator
        run: npm run test:conversas-qa
