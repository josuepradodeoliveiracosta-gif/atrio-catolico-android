name: Avisos de Conversas no Android Emulator

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qa-conversation-notices-android.yml'
      - 'app/src/**/QaConversationNotice*.kt'
      - 'app/src/main/java/br/com/atriocatolico/MainActivity.kt'
      - 'app/src/main/java/br/com/atriocatolico/OnlineAtrioApp.kt'
      - 'app/src/qaGeral/AndroidManifest.notices.xml'
      - 'app/build.gradle.kts'
      - 'scripts/run-qa-android-emulator.sh'
      - 'tests/security/seed-qa-conversation-notice-android.mjs'
      - 'firebase/qa-geral-celular/pilot/conversation-push-*.mjs'

permissions:
  contents: read

concurrency:
  group: qa-conversation-notices-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATRIO_QA_GERAL_BUILD: '1'
      ATRIO_QA_CONVERSATION_NOTICE_LAB: '1'
      ATRIO_QA_APK: qaGeral
      ATRIO_QA_FIREBASE_PROJECT: demo-atrio-v11
      ATRIO_QA_SUITE: QaConversationNoticeAndroid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
      - name: Compilar o APK isolado
        run: |
          git rev-parse HEAD HEAD^{tree}
          rm -f -- app/google-services.json
          bash scripts/qa-android-prebuild.sh start
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/security/package-lock.json
      - run: npm ci --prefix tests/security
      - name: Preparar Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Injetar sinal e conferir aviso, toque e permissão negada
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disk-size: 2048M
          ram-size: 2048M
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel on -camera-back none
          script: bash scripts/run-qa-android-emulator.sh
      - name: Registrar identificação e SHA-256 do APK
        if: always()
        run: |
          apk='app/build/outputs/apk/qaGeral/app-qaGeral.apk'
          if [ -f "$apk" ]; then
            aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n1)"
            "$aapt" dump badging "$apk" | awk '/^package: / { print }'
            test "$("$aapt" dump packagename "$apk")" = br.com.atriocatolico.qageral
            sha256sum "$apk"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-conversation-notices-${{ github.event.pull_request.head.sha }}
          path: |
            qa-android-suite-results
            qa-firebase-emulators.log
            qa-android-prebuild.log
          retention-days: 7
          if-no-files-found: warn
