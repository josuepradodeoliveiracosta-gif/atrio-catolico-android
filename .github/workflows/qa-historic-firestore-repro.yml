      - name: Dependencias fixadas pelo lockfile historico
        working-directory: historical/tests/security
        run: npm ci --ignore-scripts
      - name: Comparar baseline com snapshot em 2 bases efemeras
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/harness" python3 harness/scripts/ci_historic_firestore_predicate.py \
            --scenario ${{ matrix.scenario }} \
            --historical "$GITHUB_WORKSPACE/historical" \
            --output "$RUNNER_TEMP/qa-cached-predicate-${{ matrix.scenario }}.json"
      - name: Publicar somente sumario forense sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-cached-predicate-${{ matrix.scenario }}
          path: ${{ runner.temp }}/qa-cached-predicate-${{ matrix.scenario }}.json
          if-no-files-found: warn
          retention-days: 7

  rule-coverage:
