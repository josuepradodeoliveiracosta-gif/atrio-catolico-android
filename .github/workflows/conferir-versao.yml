name: Conferir versão oficial do Átrio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# PRs recebem o resultado do commit mais novo. Execucoes push e manual
# ganham grupo exclusivo, preservando ate aquelas ainda em andamento.
concurrency:
  group: atrio-version-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version-check:
    name: Evitar regressão de versionCode e versionName
    runs-on: ubuntu-latest
    steps:
      - name: Obter código e histórico da branch principal
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Conferir formato e testar validador
        run: |
          python3 scripts/test_status_versao.py
          python3 scripts/status_versao.py --local
      - name: Testar auditoria offline de APK antes de releases OTA
        run: python3 -m unittest discover -s tests/ota -v
      - name: Impedir regressão em pull request
        if: github.event_name == 'pull_request'
        run: python3 scripts/status_versao.py --validate-base
      - name: Impedir regressão em atualização direta da principal
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          ATRIO_PREVIOUS_COMMIT: ${{ github.event.before }}
        run: python3 scripts/status_versao.py --validate-base --base-ref "$ATRIO_PREVIOUS_COMMIT"
      - name: Exibir versão do código compilado sem documentação desatualizada
        shell: bash
        run: |
          echo "## Versão obtida de app/build.gradle.kts" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/status_versao.py --local >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Em desenvolvimento: branches/PRs são propostas, não versões lançadas." >> "$GITHUB_STEP_SUMMARY"

