name: Revisão automática - CodeQL (Kotlin, JS, Python e Actions)

# Somente analise estatica: sem deploy, Release ou credenciais oficiais.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# Novo commit na PR substitui somente analises obsoletas da propria PR.
# Push, agendamento e execucao manual recebem grupos exclusivos por run_id.
# Assim, nem uma execucao pendente desses eventos sera substituida.
concurrency:
  group: atrio-codeql-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Validar contrato seguro da revisão
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Testar invariantes sem dependências externas
        run: python3 -m unittest scripts/test_codeql_review_workflow.py -v

  codeql:
    name: CodeQL - ${{ matrix.language }}
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout sem persistir credenciais
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17 somente para Kotlin
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK somente para Kotlin
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Gradle 8.13 somente para Kotlin
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.13'
      - name: Preparar API 36 para compilação Debug
        if: matrix.language == 'java-kotlin'
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Compilar Android Debug para análise Java/Kotlin
        if: matrix.language == 'java-kotlin'
        shell: bash
        env:
          ATRIO_PUSH_WORKER_URL: ''
          ATRIO_AVATAR_WORKER_URL: ''
          ATRIO_GUARDIAN_V2_WORKER_URL: ''
          ATRIO_SIGNING_STORE_FILE: ''
          ATRIO_SIGNING_STORE_PASSWORD: ''
          ATRIO_SIGNING_KEY_ALIAS: ''
          ATRIO_SIGNING_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          python3 scripts/validar_firebase.py
          gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Analisar e publicar diagnósticos no Code Scanning
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
